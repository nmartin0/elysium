# config.yaml  (acme_corp-specific operational settings)
#
# Which LLM backend and model each call uses, agent-loop tuning, and
# which data silo(s) this deployment reads from. Different deployments
# can run entirely different models/hardware/silos by editing only this
# file -- core/ code never hardcodes any of this.

llm:
  provider: ollama                 # key into deployment_loader's LLM adapter
                                    # registry -- adapters/ollama_adapter.py
  connection:
    base_url: "http://localhost:11434/api/chat"
    request_timeout_seconds: 240   # bumped from 180 -- occasional slow calls
                                    # on this CPU-only hardware need headroom,
                                    # especially under integration test load
  step_model: "phi4-mini"          # best correctness/speed tradeoff found so
                                    # far; qwen2.5:3b tried and reverted after
                                    # it got stuck repeating its first step in
                                    # every test case, even with recovery
                                    # mechanisms in place (see git history)
  synthesis_model: "qwen2.5:3b"

agent:
  max_hops: 8
  max_consecutive_duplicates: 2
  max_consecutive_invalid_steps: 2

# Named data-silo instances. Each object type in ontology_schema.yaml
# declares which of these named silos it lives in via its own `silo:`
# key -- this is what lets a deployment span more than one adapter.
data_silos:
  primary_sql:
    adapter: sqlite
    connection:
      path: "dev_fixtures/mediator.db"

# Tools the LLM may call, by name -- entirely optional; omitting this
# section (or listing none) is completely valid, unlike llm:/data_silos:
# which every deployment needs. Registered tools live in
# core/tools/registry.py.
tools:
  enabled:
    - linear_regression
