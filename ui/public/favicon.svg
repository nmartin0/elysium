<!--
  favicon.svg - the Elysium mark: the bee skep, as on the website.

  This replaces the stand-in E that stopped the /favicon.ico 404 while
  the brand question was open (it said a real mark should replace it
  whenever that was answered; it has been). The drawing is
  site/img/logo.svg's; kept as a text SVG so the repository stays free
  of binary assets and a patch can show the change.

  IT FOLLOWS THE BROWSER'S THEME, which a raster icon cannot: dark ink
  on a light tab strip, light on a dark one - the website's two inks.
  The entrance is a hole (a mask), so it shows the tab through it.

  Clean, not glitched: a 16px tab cannot carry a three-coil slip.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 116" role="img" aria-label="Elysium">
  <style>
    .skep { fill: #080c14; }
    @media (prefers-color-scheme: dark) {
      .skep { fill: #f7f6f3; }
    }
  </style>
  <mask id="entrance">
    <rect width="112" height="116" fill="white" />
    <path d="M 47 114 a 9 12 0 0 1 18 0 z" fill="black" />
  </mask>
  <g class="skep" mask="url(#entrance)">
    <rect x="2.0" y="105.1" width="108.0" height="9.2" rx="4.6" />
    <rect x="2.0" y="94.9" width="108.0" height="9.2" rx="4.6" />
    <rect x="2.1" y="84.7" width="107.8" height="9.2" rx="4.6" />
    <rect x="2.5" y="74.5" width="107.0" height="9.2" rx="4.6" />
    <rect x="3.3" y="64.2" width="105.3" height="9.2" rx="4.6" />
    <rect x="4.9" y="54.0" width="102.2" height="9.2" rx="4.6" />
    <rect x="7.6" y="43.8" width="96.7" height="9.2" rx="4.6" />
    <rect x="12.3" y="33.6" width="87.5" height="9.2" rx="4.6" />
    <rect x="20.6" y="23.3" width="70.9" height="9.2" rx="4.6" />
    <path d="M 20.0 27.9 a 36 22.32 0 0 1 72 0 z" />
  </g>
</svg>
