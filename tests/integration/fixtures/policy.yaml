# policy.yaml  (tests/integration/'s OWN policy -- see config.yaml's
# header for why this is a fully separate fixture)
#
# Roles used by test_api.py's DYNAMICALLY created users (editor,
# customer_service, admin) are defined PERMANENTLY here, rather than
# mutated at runtime by individual tests -- the earlier design
# (reassigning/mutating app.state.config.roles mid-test) is exactly
# the kind of test/deployment-data entanglement this whole fixture
# split exists to eliminate. users: below (user_alice/bob/carol) are
# for test_full_roundtrip.py/test_region_enforcement_e2e.py, which use
# the static, policy.yaml-backed identity path (resolve_user_record),
# not the database-backed one test_api.py exercises.

security_attribute: region

roles:
  admin:
    allowed_actions:
      - manage:users
  customer_service:
    allowed_actions:
      - read:Customer
      - read:Customer.customer_id
      - read:Customer.region
      - read:Customer.name
      - read:Customer.email
      - read:Customer.transactions
      - read:Transaction
      - read:Transaction.transaction_id
      - read:Transaction.amount
      - read:Transaction.currency
      - read:Transaction.category
      - read:Transaction.transaction_date
      - read:Transaction.customer_id
      # For tests/integration/test_cross_silo_e2e.py -- the reverse
      # link ITSELF (read:Customer.support_tickets) plus real read
      # access to the target type in the OTHER silo. Without both, a
      # real model could never discover the link exists at all, let
      # alone follow it and see anything once there.
      #
      # NOTE: granting read:SupportTicket.ticket_id/customer_id makes
      # SupportTicket ALSO independently, directly searchable -- a
      # real model may legitimately reach it via search_object(
      # "SupportTicket", {"customer_id": ...}) instead of following
      # Customer.support_tickets, and both are valid, safe paths (see
      # test_real_model_follows_a_link_across_silos, which allows
      # either). See customer_service_link_only below for the role
      # that removes this alternate path specifically.
      - read:Customer.support_tickets
      - read:SupportTicket
      - read:SupportTicket.ticket_id
      - read:SupportTicket.subject
      - read:SupportTicket.status
      - read:SupportTicket.customer_id
      # For tests/integration/test_tool_use_e2e.py -- proves a real
      # model decides to invoke the tool (given real gathered numbers,
      # not fabricated ones) rather than that RBAC correctly gates it
      # (already proven by tests/unit/test_tool_authorization.py).
      - tool:linear_regression
  editor:
    allowed_actions:
      - read:Customer
      - read:Customer.customer_id
      - read:Customer.name
      - write:Customer.name
  # Deliberately grants name but NOT email -- for
  # tests/integration/test_field_denial_e2e.py, proving a real model
  # never sees (and, via the citation/email verification in
  # core/llm/synthesis_prompt.py, can never leak) a field it was
  # genuinely never granted access to.
  customer_service_no_email:
    allowed_actions:
      - read:Customer
      - read:Customer.customer_id
      - read:Customer.name
  # For tests/integration/test_cross_silo_e2e.py's
  # test_real_model_is_forced_to_follow_the_link_when_no_alternate_path_exists.
  # Deliberately grants the reverse link and SupportTicket's DATA
  # fields, but withholds read:SupportTicket.ticket_id AND
  # read:SupportTicket.customer_id -- without either, _filterable_columns()
  # has no id_field and no forward-link field to search by, so
  # search_object("SupportTicket", ...) can never locate cust_001's
  # tickets specifically. The ONLY path that can possibly work is
  # get_field(Customer, cust_001, "support_tickets"). Not a fully
  # airtight RBAC restriction in the abstract (subject/status are still
  # technically searchable, since is_searchable_field() allows any
  # plain-data field) -- but practically unusable as a discovery path,
  # since it requires already knowing the exact value to search for.
  customer_service_link_only:
    allowed_actions:
      - read:Customer
      - read:Customer.customer_id
      - read:Customer.support_tickets
      - read:SupportTicket
      - read:SupportTicket.subject
      - read:SupportTicket.status

users:
  user_alice:
    region: us-west
    role: customer_service
  user_bob:
    region: us-east
    role: customer_service
  # user_carol deliberately has NO role -- proves RBAC denial
  # independent of MAC (see test_region_enforcement_e2e.py).
  user_carol:
    region: eu
  user_dave:
    region: us-west
    role: customer_service_no_email
  # For tests/integration/test_write_proposal_e2e.py -- needs a role
  # actually granting write:Customer.name to test whether a real model
  # produces a well-formed propose_write step, not just a scripted one
  # (already proven by tests/unit/test_write_mediator.py).
  user_eve:
    region: us-west
    role: editor
  # For tests/integration/test_cross_silo_e2e.py's link-only test --
  # see customer_service_link_only above for exactly what's withheld
  # and why.
  user_frank:
    region: us-west
    role: customer_service_link_only
