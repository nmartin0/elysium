# ontology_schema.yaml  (tests/integration/'s OWN schema -- see
# config.yaml's header for why this is a fully separate fixture, not
# the real deployment/etc/ontology_schema.yaml)
#
# Each type's "storage" block holds ONLY its physical backing --
# everything else in a type's entry is purely SEMANTIC. See
# core/ontology/mediator.py's own docstring for the full reasoning.

object_types:
  Customer:
    storage:
      silo: primary_sql
      table: customers
      id_column: customer_id
    # MDO (multi-datasource object types) -- for tests/integration/
    # test_mdo_e2e.py, proving a real model transparently reads a
    # field backed by a GENUINELY SEPARATE silo, with no indication in
    # its own prompt this field is any different from any other. See
    # core/ontology/mediator.py's own MDO docstring for the mechanism.
    # Deliberately mismatched naming, same as tests/unit/test_mdo.py --
    # risk_db's own id_column is "cust_ref", not "customer_id".
    additional_storage:
      risk_db:
        silo: risk_sql
        table: customer_risk
        id_column: cust_ref
    id_field: customer_id
    title_field: name
    security:
      field: region
    fields:
      region:
        type: data
      name:
        type: data
      email:
        type: data
      # The MDO field itself -- backed by risk_db, not primary_sql.
      # Deliberately mismatched column name too (score_val, not
      # risk_score) -- see get_field_column()'s own docstring for why.
      risk_score:
        type: data
        storage: risk_db
        column: score_val
      transactions:
        type: link
        target: Transaction
        cardinality: many
        via_table: transactions
        via_column: customer_id
      # Reverse link into a GENUINELY SEPARATE database (support_crm,
      # see config.yaml) -- for tests/integration/test_cross_silo_e2e.py,
      # a real model discovering and following a cross-silo link on its
      # own, not a scripted one (already proven by tests/unit/
      # test_cross_silo_links.py).
      support_tickets:
        type: link
        target: SupportTicket
        cardinality: many
        via_table: tickets
        via_column: customer_id
  Transaction:
    storage:
      silo: primary_sql
      table: transactions
      id_column: transaction_id
    id_field: transaction_id
    security:
      via_field: customer_id
    fields:
      amount:
        type: data
      currency:
        type: data
      category:
        type: data
      transaction_date:
        type: data
      customer_id:
        type: link
        target: Customer
        cardinality: one
  SupportTicket:
    storage:
      silo: support_crm
      table: tickets
      id_column: ticket_id
    id_field: ticket_id
    # A SECURITY CHAIN, not a direct field -- MAC is resolved by
    # following customer_id back to Customer.region, exactly the
    # pattern already proven in tests/unit/test_cross_silo_links.py.
    # This chain genuinely crosses the silo boundary at resolution
    # time: _get_security_value()'s recursive call re-resolves
    # _adapter_for("Customer") fresh, from primary_sql, even though
    # THIS type's own data lives in support_crm.
    security:
      via_field: customer_id
    fields:
      subject:
        type: data
      status:
        type: data
      customer_id:
        type: link
        target: Customer
        cardinality: one
  # For tests/integration/test_transfer_funds_e2e.py and
  # tests/unit/test_transfer_funds.py -- the first REAL, deliberately-
  # authored multi-object action_type (TransferFunds, below), the
  # actual end-to-end proof the whole sub_writes/write_log_batches
  # mechanism works, not just its synthetic-fixture unit tests.
  Account:
    storage:
      silo: primary_sql
      table: accounts
      id_column: account_id
    id_field: account_id
    # A SECURITY CHAIN, not a direct field -- same pattern as
    # SupportTicket above (via_field: customer_id): MAC resolves by
    # following owner_customer_id back to Customer.region.
    security:
      via_field: owner_customer_id
    fields:
      balance:
        type: data
      currency:
        type: data
      owner_customer_id:
        type: link
        target: Customer
        cardinality: one

# NAMED ACTION TYPES (action-types-redesign branch) -- for
# tests/integration/test_named_actions_e2e.py, proving a real model
# transparently discovers, describes correctly to itself, and invokes
# a genuinely NEW proposal mechanism (propose_action, execute: grants)
# it has never been prompted with before this branch existed.
#
# Deliberately NO submission_criteria on this one -- that mechanism is
# already thoroughly proven by tests/unit/test_named_actions.py and
# tests/unit/test_agent_step_prompt_named_actions.py. This test's one
# genuinely unproven question is narrower: can a real model correctly
# read and use the propose_action vocabulary at all. Keeping other
# variables out keeps that question isolated.
#
# Granted to editor (user_eve, see policy.yaml) -- originally built
# with a dedicated user (user_grace) specifically to avoid changing an
# EXISTING, already-tested user's prompt mid-branch (the exact kind of
# silent-drift risk this project caught once already this session, the
# MDO risk_score addition to customer_service). Once the full
# migration pass deliberately moved editor onto execute: grants too,
# that isolation concern no longer applied -- user_grace was
# consolidated away as genuinely redundant footprint, not a risk
# reduction anymore.
action_types:
  UpdateCustomerName:
    affected_object_types: [Customer]
    parameters:
      customer_id:
        type: object_reference
        object_type: Customer
        required: true
      new_name:
        type: string
        required: true
    sub_writes:
      - object_type: Customer
        object_id: parameter.customer_id
        operation: update
        mutations:
          - set: {property: name, value: parameter.new_name}
  # For tests/integration/test_write_proposal_e2e.py -- the one real,
  # still-open gap this project had: "user.security_value" and writing
  # to a type's own id_field (see core/ontology/write_mediator.py's
  # _resolve_mutation_value() and core/ontology/schema.py's
  # get_column_for_field()) were both found and fixed while building
  # named actions, but neither had ever been exercised by a REAL,
  # freely-reasoning model before -- only unit tests and direct
  # scratch verification. This action exercises BOTH together: the
  # model supplies customer_id (id_field) and name/email directly, and
  # region (the MAC security field) is populated automatically from
  # the ACTING user's own value, never the model's choice.
  CreateCustomer:
    affected_object_types: [Customer]
    parameters:
      customer_id:
        type: object_reference
        object_type: Customer
        required: true
      name:
        type: string
        required: true
      email:
        type: string
        required: true
    sub_writes:
      - object_type: Customer
        object_id: parameter.customer_id
        operation: create
        mutations:
          - set: {property: customer_id, value: parameter.customer_id}
          - set: {property: name, value: parameter.name}
          - set: {property: email, value: parameter.email}
          - set: {property: region, value: user.security_value}
  # For tests/integration/test_transfer_funds_e2e.py and
  # tests/unit/test_transfer_funds.py -- the first REAL, deliberately-
  # authored MULTI-OBJECT action_type: two sub_writes, both Account,
  # exercised through the real apply path (WriteMediator._apply_
  # batch(), DataMediator._locks_for_objects() with two genuinely
  # different real locks) rather than only the synthetic fixtures
  # test_write_log_batches.py/test_action_types_validation.py already
  # used to prove the mechanism's own correctness in isolation.
  #
  # Same-type sub_writes (Account -> Account) -- only execute:
  # TransferFunds is required by RBAC, not any write:<Type>.<field>
  # grant; that separate path (a cross-TYPE action) is already proven
  # by tests/unit/test_write_mediator.py's own synthetic fixtures, not
  # this addition's own job to prove again.
  #
  # Mutations only ever "set" a value -- there is no arithmetic
  # increment/decrement mutation kind, deliberately (see core/ontology/
  # write_mediator.py's own docstring on mutation resolution). A real
  # transfer's own new balances are therefore parameters the CALLER
  # supplies directly, already computed -- exactly how a real person
  # using this system would gather each account's current balance
  # first (an ordinary read), then propose the write with the values
  # they've already worked out, not something this action computes
  # for them.
  TransferFunds:
    affected_object_types: [Account]
    parameters:
      from_account_id:
        type: object_reference
        object_type: Account
        required: true
        # A real, previously-discovered gap this closes: with BOTH
        # from_account_id and to_account_id referencing the SAME
        # object_type (Account), ui/'s own ActionForm.jsx used to
        # pre-fill and lock BOTH fields to whichever account this
        # action was opened from -- there was no way to actually
        # specify a different "to" account through the form at all.
        # default_to_current_object marks EXACTLY WHICH parameter
        # should be treated that way -- explicit, by parameter
        # identity, never inferred from object_type alone (see core/
        # ontology/action_types.py's own docstring for the full
        # reasoning, confirmed directly against Palantir Foundry's own
        # documented mechanism for this exact case). from_account_id,
        # not to_account_id -- a transfer is naturally framed as
        # moving money FROM the account whose page you're already on.
        default_to_current_object: true
      to_account_id:
        type: object_reference
        object_type: Account
        required: true
      new_from_balance:
        type: number
        required: true
      new_to_balance:
        type: number
        required: true
    sub_writes:
      - object_type: Account
        object_id: parameter.from_account_id
        operation: update
        mutations:
          - set: {property: balance, value: parameter.new_from_balance}
      - object_type: Account
        object_id: parameter.to_account_id
        operation: update
        mutations:
          - set: {property: balance, value: parameter.new_to_balance}
