# config.yaml  (tests/integration/'s OWN, fully isolated test deployment)
#
# Deliberately NOT the same file as deployment/etc/config.yaml -- this
# is a genuinely separate deployment, used ONLY by the test suite, so
# nothing a test does can ever affect (or be affected by) the real
# deployment a human explores by running scripts/run_deployment.py or
# a real install. Same principle tests/conftest.py's Author/Book test
# schema already established for tests/unit/, applied here too:
# decoupled from the real deployment, not accidentally coupled to it.

llm:
  provider: ollama
  connection:
    base_url: "http://localhost:11434/api/chat"
    # 480s, not the more typical 240 -- raised based on real, repeated
    # evidence, not a guess: this specific VM (2 CPU cores) genuinely,
    # consistently needed more than 240s for some calls under sustained
    # load, confirmed directly (a real 134% CPU llama-server process
    # observed via `ps`, one full core saturated) and reproducibly
    # (3 consecutive clean timeouts on the same call, surviving even a
    # full Ollama restart in between -- ruling out a stuck/hung process
    # as the cause). This is a genuine hardware-capacity accommodation,
    # not a workaround for a hang or a bug.
    #
    # RAISED AGAIN, 480 -> 600, ON A NEW MEASUREMENT: a COLD first call
    # exceeds 480. scripts/llm_bench.py timed one at 520.89s against
    # the dev deployment -- whose schema is SMALLER than this fixture's
    # -- and the injection test here died at exactly `read timeout=480`
    # on its first hop, with `gathered` still empty.
    #
    # THE PATTERN MATTERS MORE THAN THE NUMBER. 240 -> 480 -> 600 is
    # chasing a figure, and it stops here for a reason rather than
    # another increment: a cold call is a DIFFERENT COST from a warm
    # one, not a slower one. Nothing is cached, so the whole prompt is
    # read at the ~5.4 tokens/s prompt-eval rate. deployment/etc/
    # config.yaml already chose 600 on exactly that reasoning -- "240
    # timed out on the first hop" -- so this is now aligned with it
    # rather than guessed separately.
    #
    # A timeout below the cost of a cold call does not protect
    # anything: it guarantees the first query after a model load
    # fails, which is the one a person is most likely to be watching.
    request_timeout_seconds: 600
    # KEEP THE MODEL RESIDENT. This is the actual fix; the timeout
    # increases above were treating a symptom, and I should say so
    # plainly because I raised it twice before looking here.
    #
    # Ollama evicts a model, and its KV cache with it, after FIVE
    # MINUTES of inactivity by default. This file never set
    # keep_alive, so:
    #
    #   - every integration run started cold, because the last one
    #     finished more than five minutes ago;
    #   - and the two models below EVICT EACH OTHER. A step call loads
    #     qwen3:4b, synthesis loads qwen2.5:3b, and on a 2-core box
    #     with limited memory the next step call may pay a full load
    #     again. deployment/etc/ uses ONE model for every call and
    #     says why: "Two models mean Ollama loading and evicting
    #     between them -- measured at 12-47 seconds per load on this
    #     hardware, paid at least once per query."
    #
    # THE LOAD IS THE SMALLER HALF, AND THE NUMBERS SAY SO. 12-47
    # seconds of reload does not explain a 600-second timeout. What
    # does is that eviction DUMPS THE KV CACHE, so every call re-reads
    # its whole prompt at the prompt-eval rate. AR-1 measured that
    # difference on the dev deployment: 520.89s cold against 50.58s
    # warm on a LONGER prompt, once the prefix was cached.
    #
    # None of that reuse could ever appear here, which is also why no
    # integration test has ever shown AR-1's or AR-2's effect.
    keep_alive: -1
  step_model: "qwen3:4b-instruct-2507-q4_K_M"
  synthesis_model: "qwen2.5:3b"

agent:
  max_hops: 8
  max_consecutive_duplicates: 2
  max_consecutive_invalid_steps: 2

tools:
  enabled:
    - linear_regression

# READS COME FROM GOLD (GOLD-9). This suite used to declare
# `read_from_mirror: false` and test the ontology against the silo
# databases directly. The comment here said "when it goes, this line
# is the list of what has to change" -- and this is that change: the
# fixtures sync once per session and every test copies the result.

