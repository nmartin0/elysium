[tool.ruff]
# 120, not the tool defaults' 79/88 -- matches this project's own,
# already-established line-length practice (confirmed directly: nearly
# the entire codebase already sits under 120, with only a couple of
# genuine outliers), not an arbitrarily chosen number.
line-length = 120
target-version = "py312"


# `ruff format` is deliberately NEVER run by lint.sh, or anywhere else
# in this project -- a real, considered decision, not an oversight.
# Verified directly (not assumed) by actually running `ruff format
# --diff` against this project's real, current code before writing
# this: it would rewrap a genuine, recurring, deliberate pattern in
# this codebase's own hand-placed formatting -- multi-argument
# function signatures and calls broken across lines specifically for
# readability, even in places short enough to fit on one line under
# this file's own 120-char limit (e.g. adapters/sqlite_adapter.py's
# own find_ids_matching_text() and write_fields(), api/routes.py's
# own create_user_route()). ruff format would collapse or re-wrap
# these into its own, generic, denser style, on every file, every
# run -- overriding real, deliberate authorial choices with a tool's
# default opinion, not fixing a genuine problem the way ruff check,
# mypy, and vulture each do. Those three all detect something
# objectively wrong (a real bug, a real type mismatch, real dead
# code); reformatting has no "correct" answer, only a consistent one
# -- and this project has chosen to keep that consistency a deliberate,
# human decision, not an automated one. `ruff format --check` remains
# available to run by hand at any time; it is simply never wired into
# this project's own CI-equivalent (lint.sh) or run silently as a
# side effect of anything else.
#
# vulture_whitelist.py is deliberately NOT ordinary executable Python
# -- it's a sequence of bare name references, Vulture's own required
# whitelist format (each line marks a name as "used" for Vulture's
# purposes). Ruff, scanning it as normal code, correctly-from-its-own-
# perspective flags every single line as F821 (undefined name) and
# B018 (useless expression) -- a real, confirmed false-positive class
# specific to this one file's special format, not a reason to weaken
# F821/B018 project-wide.
# AND `site`, because the website is not Elysium. It was moved out of
# tests/unit and its vulture whitelist entry removed, and I said the
# coupling was gone -- it was not. Ruff lints the repository, so a
# `zip()` in the WEBSITE's own test file failed ELYSIUM's gate. Same
# shape as before, one tool further down. The site runs its own ruff
# in site/check.sh.
exclude = ["vulture_whitelist.py", "site"]

[project]
# DECLARED SO THE EXTRA BELOW CAN ACTUALLY BE INSTALLED. Without a
# name and a version, `pip install -e ".[identity]"` fails with
# "`project` must contain ['version'] properties" -- so the extra was
# a declaration no command could satisfy, which is why splink was
# installed on nobody's machine and eight tests skipped everywhere.
#
# Elysium is RUN FROM A CHECKOUT, not installed as a library: the
# runtime dependencies stay in requirements.txt with their locks, and
# this table exists for the extra and nothing else.
name = "elysium"
version = "0.0.0"
requires-python = ">=3.12"

[tool.setuptools]
# The packages an editable install puts on the path. Named explicitly
# because automatic discovery finds `deployment`, `tests` and the
# worktree directories too.
packages = ["core", "api", "adapters", "scripts"]

[project.optional-dependencies]
# PROBABILISTIC IDENTITY RESOLUTION (GOLD-6), optional because
# inference is off by default and this brings 186 MB across seven
# transitive packages. A deployment that never enables it never
# installs it; the DECLARED rule in identity.match_on works without.
#
# Splink is pinned below the release whose estimate_u_using_random
# _sampling raises "Salting partitions must be specified and > 1" --
# reproduced across four version pairs. Elysium declares its weights
# rather than estimating them, so that path is unused, but a pin is
# cheaper than discovering it from a deployment.
identity = ["splink>=4.0,<5"]

[tool.ruff.lint]
# Four genuinely different, non-overlapping concerns, not picked
# arbitrarily -- each verified directly against this codebase before
# being added:
#   E, W  -- pycodestyle (real style errors/warnings)
#   F     -- pyflakes (unused imports/names, undefined names -- the
#            same real signal Flake8 provided, ground-tested here:
#            found 3 genuine unused imports, zero noise)
#   I     -- import sorting (isort-equivalent) -- cosmetic but free,
#            auto-fixable, no judgment calls involved
#   B     -- flake8-bugbear -- real Python gotchas (mutable defaults,
#            swallowed exception context, non-strict zip()) -- ground-
#            tested here: found 6 genuine "raise ... from" sites and 1
#            genuine zip(strict=) gap, both real, worth fixing
#   UP    -- pyupgrade -- modernize syntax to the target Python version
# Deliberately NOT pylint-equivalent rules (C901 complexity, docstring
# conventions, naming conventions) -- this project's own style
# (long, deliberately explanatory docstrings; multi-clause function
# signatures) would generate persistent, subjective noise against
# choices that are intentional here, not oversights.
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# B008 ("don't call functions in argument defaults") is a real,
# valuable check in general -- but FastAPI's Depends()/Header() are
# THE idiomatic, required way to declare a route's dependencies, and
# FastAPI itself evaluates them fresh per-request, not once at
# definition time the way B008 assumes. Ground-tested directly: every
# single B008 hit in this codebase was exactly this FastAPI pattern,
# zero genuine mutable-default-argument bugs -- allowlisting these two
# callables keeps B008 fully active for everything else.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]

[tool.mypy]
# core/, api/, and adapters/ are where this project's real logic and
# type contracts live -- scripts/ are throwaway entry points. Not
# scanning tests/ deliberately: test fixtures lean on dynamic patterns
# (MagicMock, pytest fixture parameter-name matching) that produce
# type-checker noise disproportionate to the value here.
#
# api/ was verified worth including, not assumed -- running mypy
# against it directly surfaced a real, previously-unnoticed issue from
# this project's own write-log work: WriteMediator.write_log_db_path
# is typed as a required Path, but api/app.py was passing
# mediator.write_log_db_path, itself typed Path | None (DataMediator's
# own copy is genuinely optional) -- a real, if currently benign,
# type-contract gap between the two.
# `simulator` IS THE GRAFTED SIM (sim/simulator). It passes this
# checker unchanged: sim pinned `mypy<2` and Elysium runs 2.3.1, and
# the older pin turned out to be unnecessary -- 55 source files, no
# issues. That pin is why sim's requirements downgraded Elysium's type
# checker by a major version whenever either was installed.
files = ["core", "api", "adapters", "scripts/check_controls.py", "sdk/python", "sim/panel/server.py",
         "sim/simulator"]
ignore_missing_imports = true

[tool.vulture]
paths = ["core", "api", "adapters", "scripts", "tests",
         "sim/simulator", "sim/tests", "sim/panel", "sdk",
         "vulture_whitelist.py"]
min_confidence = 60

[tool.importlinter]
root_packages = ["core", "api", "adapters", "simulator"]

# Contract 1 of 3 -- the outer, top-level layering. api is the entry
# point (HTTP layer, wires everything together); adapters implement
# the concrete storage/LLM backends; core holds the domain logic and
# must never know which concrete backend it's actually talking to
# (dependency inversion -- core defines the interfaces adapters/ own
# files implement, e.g. core.ontology.interface, core.llm.interface,
# core.functions.interface).
#
# Confirmed directly against this project's REAL, current imports
# before writing this (not assumed): api and adapters genuinely never
# import from each other, and core genuinely never imports from api
# at all. core.deployment_loader is the ONE, deliberate exception --
# it's this project's own composition root, the single place
# responsible for instantiating a concrete adapter (OllamaAdapter,
# SQLiteAdapter) based on deployment config and injecting it into
# core.ontology.mediator.DataMediator -- not a violation, and
# whitelisted explicitly below rather than weakening this contract
# for the rest of core/.
[[tool.importlinter.contracts]]
name = "api sits above adapters and core; core never reaches into adapters or api"
type = "layers"
layers = ["api", "adapters", "core"]
ignore_imports = [
    "core.deployment_loader -> adapters.ollama_adapter",
    "core.deployment_loader -> adapters.vllm_adapter",
    "core.deployment_loader -> adapters.claude_agent_sdk_adapter",
    "core.deployment_loader -> adapters.sqlite_adapter",
    # The adapter REGISTRY is the one place core names a concrete
    # adapter, and each exception is listed rather than the rule
    # weakened. A fifth would be a fifth line here.
    "core.deployment_loader -> adapters.sqlalchemy_adapter",
    # The embedder (R45, 18 October): built where the chat adapters are.
    "core.deployment_loader -> adapters.embedding_adapter",
    # The CSV folder source (19 October): registered where the others are.
    "core.deployment_loader -> adapters.csv_folder_adapter",
    "core.deployment_loader -> adapters.rest_adapter",
]

# Contract 2 of 3 -- the real, internal shape of core/ itself, mapped
# directly against this project's actual import graph before writing
# this list (not designed from memory or assumption): core.agent (the
# LLM-driven agentic loop) sits at the top, orchestrating everything
# else; core.functions and core.intermediate_layer are true leaves (never
# import from any other core.X submodule). The middle ordering
# (llm, memory, ontology) reflects real, confirmed dependencies --
# core.llm imports core.ontology and core.functions; core.memory imports
# core.intermediate_layer and core.ontology; core.ontology imports
# core.intermediate_layer. core.auth has no real position requirement
# of its own (nothing else in core/ depends on it directly -- its
# only real consumer within core/ is core.user_directory, and
# ultimately api/ itself for the login/session endpoints), placed
# here as a leaf alongside core.intermediate_layer and core.functions.
[[tool.importlinter.contracts]]
name = "core/ internal layering (agent orchestrates llm/memory/ontology/functions)"
type = "layers"
layers = [
    "agent", "mirror", "llm", "memory", "ontology", "auth",
    "intermediate_layer", "functions",
    # The filter vocabulary, below everything. It started inside
    # core/ontology and moved out because core.functions sits BELOW
    # ontology here and needs it too -- OntologyAccess builds
    # conditions for a search. A vocabulary that the bottom layer
    # cannot reach is in the wrong place, and the contract said so.
    #
    # It imports nothing from core: it validates the SHAPE of an
    # expression and the TYPES of its values, and knows nothing about
    # schemas, callers or storage.
    "filters",
    # request_context sits at the BOTTOM: it imports nothing but the
    # standard library, and everything from the mediator up threads it.
    # A leaf with no dependencies can be depended on by any layer
    # without creating a cycle.
    "request_context",
    # deep_freeze, the same shape as filters and request_context above:
    # a leaf importing nothing but the standard library. It knows what a
    # dict, list and set are and nothing else -- not what a schema is,
    # not what a role is. deployment_loader is its only caller today,
    # and any layer may reach it without creating a cycle.
    "immutable",
    # invisible_text, another leaf importing nothing but the standard
    # library. It knows which codepoints have no glyph and nothing
    # else -- not what a field is, not what a row is. Two callers
    # today: core.ontology.constraints declares the rule, and the
    # mirror reports it. A leaf both can reach without a cycle.
    # The columns Elysium writes into every row. A LEAF because
    # core/mirror writes them and core/ontology reads one, and the
    # contract forbids ontology reaching into mirror.
    "carried_columns",
    "invisible_text",
    # What may be shown to somebody who did not ask for it. Sits beside
    # invisible_text and misleading_text: all three answer "is this
    # string safe to put in front of a person", and none of them knows
    # about callers, grants or storage. It takes a mediator as an
    # argument rather than importing one, so it stays a leaf.
    "display_safety",
    # Which "something changed" hints a caller may receive. A LEAF: it
    # takes the caller's own visible_schema as an argument rather than
    # deciding anything, so it imports nothing from core and knows
    # nothing about transports or about what changed.
    "change_hints",
    # What a merge reviewer is shown when they may not read the fields
    # that decide the match. A LEAF for the same reason: it takes the
    # readable field names as an argument and decides no access
    # question itself.
    "masked_review",
    # misleading_text, its sibling and the same shape: a leaf that
    # knows which characters lie about what they are, and nothing
    # about fields or rows.
    "misleading_text",
    # config_history, a leaf like artifact_store: its own SQLite store,
    # importing nothing from core but the shared connection helper.
    "config_history",
    # request_metrics, the same shape again: one SQLite table of request
    # timings, importing only the shared connection helper. It knows
    # what a route and a duration are and nothing else -- not what an
    # object is, not what a role is -- so any layer may reach it.
    "request_metrics",
    # identity_decisions, the same shape a third time (GOLD-6): one
    # SQLite store of proposed merges and what a person decided about
    # them. A leaf, deliberately -- it imports nothing from core,
    # because the thing that READS it (core.mirror) sits above, and a
    # store that knew about its reader would invert that.
    "identity_decisions",
    # The artifact store, also a leaf. It persists and scopes saved
    # things -- searches, selections, pending writes -- and knows
    # nothing about what is inside one: `body` is opaque JSON.
    #
    # Below everything on purpose. Whether a saved search's filters are
    # still readable by whoever opens it is RE-authorization, needs the
    # ontology and a caller, and belongs to the reader. A store that
    # returned "safe" content would be a second place deciding what a
    # caller may see.
    "artifact_store",
    # A TRUE LEAF: it imports nothing from core at all, only os and re.
    # So it goes at the BOTTOM of the layer list rather than into
    # exhaustive_ignores, which is for modules that sit outside the
    # hierarchy rather than beneath it.
    "secret_references",
    # addons: an add-on server's declaration, its token and which
    # headers pass (BLOCKING.md item 3, step 2). A leaf: the standard
    # library only; api/addon_servers.py does the sockets and processes.
    "addons",
    # config_editing is a leaf too: ruamel and the standard library, no
    # core module -- the route composes it with the loader and reload.
    "config_editing",
    # notifications imports only sqlite_connection, which is itself
    # outside the hierarchy -- so this is a leaf beside
    # secret_references rather than a module sitting outside.
    "notifications",
    # saved_views imports only sqlite_connection, like notifications.
    "saved_views",
    # config_proposals imports only sqlite_connection, like saved_views:
    # it stores what waits; the route decides what may.
    "config_proposals",
    # canvas_layout imports only sqlite_connection, like saved_views --
    # one person's presentation, which nothing that decides meaning reads.
    "canvas_layout",
    # enrichment_recipes imports only sqlite_connection, like saved_views.
    "enrichment_recipes",
    # prediction_proposals likewise: it stores measurements and decisions.
    "prediction_proposals",
    # unusual_flags imports only sqlite_connection, like the other stores;
    # unusual, the scoring, imports nothing of Elysium's.
    "unusual_flags",
    "unusual",
    # forecasts imports only periods below it and, lazily, statsmodels.
    "forecasts",
    # periods imports nothing of Elysium's: date arithmetic, read by the
    # mediator and the forecasts.
    "periods",
    # frozen_sets imports only sqlite_connection, like saved_views --
    # its sibling, the frozen kind of saved set.
    "frozen_sets",
    # triggers imports only sqlite_connection, like saved_views.
    "triggers",
    # timers imports only sqlite_connection, like triggers (16 October):
    # the store any caller registers "call me back then" in.
    "timers",
    # embeddings imports only sqlite_connection and numpy (R45): the
    # vectors, their versions and the ranking. The sync and the routes
    # compose it with the ontology.
    "embeddings",
    # reminders sits on timer_rules (17 October): what a person's own
    # timer says and when it repeats. timer_rules imports only zoneinfo.
    "reminders",
    "timer_rules",
    # role_store imports only sqlite_connection, like the other stores.
    "role_store",
    # role_changes imports only sqlite_connection, like role_store.
    "role_changes",
    # paused_queries imports only sqlite_connection, like role_changes
    # (WIRED-2). It holds no authority: resume re-reads the asker.
    "paused_queries",
    # Two leaves for encryption at rest (decided 14 Oct): the volume
    # check imports only the standard library; the backup archive only
    # it and `cryptography`.
    "storage_encryption",
    "encrypted_archive",
    # rule_suggestions imports only sqlite_connection (R31): it keeps a
    # person's judgement on a suggestion, not the rule.
    "rule_suggestions",
    # source_health imports nothing from core: it is handed the
    # adapters it checks (E-13).
    "source_health",
    # ANOTHER TRUE LEAF, beside secret_references: export imports csv
    # and io and nothing from core. It renders a list of dicts as a
    # file and knows nothing about what an object is -- which is the
    # point. Deciding WHICH rows and WHICH columns a caller may have
    # needs the ontology and belongs to the route; this one only has
    # to be certain that no cell it is handed can execute.
    "export",
    # Whether an id is one the erasure register says to forget (R13).
    # A LEAF at the very bottom: it is handed the register's hasher and
    # hashes and imports nothing from core, so every store -- frozen
    # sets, notifications, paused questions, identity decisions, the
    # write log -- can ask it the same question the same way.
    "erased_ids",
]
containers = ["core"]
exhaustive = true
# pending_write_persistence and pending_write_serialisation join
# pending_write_store here for the same reason it is already listed:
# they are storage for a thing the ontology defines, so they sit ABOVE
# ontology while the store they serve sits outside the hierarchy
# entirely. Placing them in the layer list would force a position that
# says something untrue about what depends on what.
# count_condition sits ABOVE filters -- it imports FieldFilter to run a
# saved view -- and outside the hierarchy otherwise: it is trigger
# machinery, not a layer anything else builds on.
# role_impact (DEV_UI 13.5) sits with deployment_loader: it compiles
# proposed grants through access_roles and asks a mediator, so it
# composes the loader, the ontology and role_changes -- outside the
# hierarchy, like the loader, rather than beneath part of it.
# trigger_runs (16 October) is count_condition's caller for the sync and
# the server's checks alike: trigger machinery composing the stores and
# the evaluator, outside the hierarchy as count_condition is.
# trigger_windows beside it: it asks a mediator when a date window next
# changes and registers a timer -- trigger machinery too. trigger_states
# (17 October) the same: combined, held and scheduled triggers, composing
# count_condition, timers and the rules.
# meaning_search (R45, 18 October) composes the vector store, the model
# interface and the ontology's declaration for Browse and the agent
# alike -- above all three, outside the hierarchy like trigger_states.
# predictions (R48) reads the ontology's declaration to train and
# measure a predicted field; the sync composes it -- outside the
# hierarchy for the reason meaning_search is.
# projected_condition (R68, 18 October) is a trigger's forecast of its
# view's totals per period: trigger machinery beside count_condition,
# composing the mediator's aggregate and the forecasts.
# modules (BLOCKING item 3, 21 October) sits with deployment_loader, its
# only loader: it reads module.json files with core.config and asks
# intermediate_layer's authorize who is offered each -- configuration
# composed with authorization, outside the hierarchy like role_impact.
exhaustive_ignores = ["modules", "predictions", "meaning_search", "adapter_roles", "count_condition", "projected_condition", "trigger_runs", "trigger_windows", "trigger_states", "declared_triggers", "concurrency", "config", "deployment_loader", "role_impact", "internal_storage", "logging_config", "pending_write_persistence", "pending_write_serialisation", "pending_write_store", "sqlite_connection", "user_directory"]

# Contract 3 of 3 -- the single most repeatedly-stated architectural
# principle throughout this project's own history: authentication
# (core.auth -- who is this person, verified via password/session,
# the front gate) is completely separate from authorization
# (core.intermediate_layer -- what is this person allowed to do,
# RBAC/MAC access control). Confirmed directly, before writing this,
# that this was ALREADY true in practice throughout this codebase's
# real history -- neither package imports from the other anywhere --
# this contract exists to keep that real, already-honored property
# genuinely enforced going forward, not to fix an existing violation.
# A stricter, additional guarantee than contract 2's own layers
# ordering alone provides: layers only forbids the LOWER of two
# adjacent layers importing from the higher one; this forbids BOTH
# directions between this specific pair, regardless of where either
# one sits in that ordering.
[[tool.importlinter.contracts]]
name = "authentication (core.auth) and authorization (core.intermediate_layer) stay fully independent"
type = "independence"
modules = ["core.auth", "core.intermediate_layer"]

# The remaining contracts below map the real, internal shape of each
# multi-file package individually -- the three above cover the
# BETWEEN-package picture; these cover WITHIN each package, mapped the
# same way (against this project's own real, current imports, not
# designed from assumption).

[[tool.importlinter.contracts]]
name = "api/ internal layering (app wires routes + csrf + request size limit; routes wires apps + dependencies)"
type = "layers"
# generation_dependency sits beside auth_dependency: both are
# per-request dependencies routes wires, and neither may import the
# other. One resolves WHO is asking, the other WHICH configuration
# answers -- independent questions, deliberately kept that way.
#
# generation_header_middleware sits beside them rather than above:
# it reads the pin that generation_dependency leaves on request.state
# but does NOT import it, reaching the value through the ASGI scope.
# Middleware that imported a dependency would make the two orderable,
# and they are not.
layers = [
    "app", "routes",
    "apps | auth_dependency | generation_dependency | reload | addon_servers | csrf_middleware | request_size_limit_middleware | generation_header_middleware | request_metrics_middleware | live_updates | timer_service | trigger_checks | reminders",
]
containers = ["api"]
exhaustive = true

[[tool.importlinter.contracts]]
name = "core/ontology/ internal layering (write_mediator wraps mediator, both sit above the rest)"
type = "layers"
layers = [
    # Who can see a type (DEV_UI 13.3) asks the mediator it is HANDED
    # once per role, and imports nothing from this package: on top, so
    # it may only ever look down.
    "who_can_see",
    "write_mediator",
    "mediator",
    # Rules between two fields (R29) compare through constraints, so
    # they sit above it; the write mediator and silver read them.
    # Derived fields (R37) sit beside them: the mediator computes them,
    # and they read only field_types.
    "field_rules | derived_fields",
    # Enriched fields (R41) below them: derived_fields gates reads on
    # both kinds of computed field, and enrichment reads only
    # classifications.
    # Search by meaning (R45) beside it: a declaration the mediator asks
    # about, reading only classifications.
    "enriched_fields | semantic_search | predicted_fields | unusual_checks",
    # Its extraction rules (17 October): the shapes, the tokenizer, and
    # typing a span through field_types.coerce, below.
    "extraction_rules",
    "interface | schema | write_log | submission_criteria | action_types | object_type_validation | constraints | gold_view | bindings",
    # Real leaves, below everything. object_type_validation imports
    # field_types (to reject an unknown declared data_type at load
    # time), and mediator imports filters; neither imports anything in
    # this package back.
    #
    # The filter vocabulary moved OUT of this package, to core/filters.py:
    # core.functions sits below core.ontology in the layering above and
    # needs it too, so a vocabulary living inside ontology could not be
    # reached from there.
    # classifications is a leaf too: object_type_validation checks a
    # label's shape with it, and core/mirror reads labels through it.
    # value_checks is a leaf too (DEP-4): constraints and silver's
    # standardisation call it, and it imports nothing from here.
    # value_types expands into rules value_checks judges (R28).
    "value_types",
    # unrestricted (19 October) is a leaf: the declaration, its sentinel
    # and is_unrestricted, read by validation, the mediator, the write
    # mediator and who_can_see; it imports nothing. silo_security (27
    # October) is a leaf beside it: the loader resolves `security: inherit`
    # with it, and it imports nothing.
    "field_types | link_types | classifications | value_checks | unrestricted | silo_security",
    # Below field_types, which reads locale-written text through it
    # (DEP-1). It imports nothing from this package.
    "localised_values",
    # How a Decimal leaves the API as exact text (PA001-G12). Imports
    # only the standard library; api/ is its only caller.
    "decimal_text",
]
containers = ["core.ontology"]
exhaustive = true

[[tool.importlinter.contracts]]
name = "core/intermediate_layer/ internal layering (access_control wraps auth; audit, policy_validation stay leaves)"
type = "layers"
layers = ["access_control", "auth | audit | policy_validation"]
containers = ["core.intermediate_layer"]
exhaustive = true

# core.llm.interface is the one real leaf (the LLMAdapter Protocol
# itself); the other three each implement or consume it but were
# never meant to depend on EACH OTHER -- independence, not layers,
# since there's no real ordering between them, just a shared leaf all
# three sit above.
[[tool.importlinter.contracts]]
name = "core/llm/ siblings (agent_step_prompt, concurrency_limited_adapter, synthesis_prompt) stay independent of each other"
type = "independence"
modules = [
    "core.llm.agent_step_prompt",
    "core.llm.concurrency_limited_adapter",
    "core.llm.synthesis_prompt",
]

# The three concrete adapters are deliberately parallel, alternative
# implementations of the same core/ interfaces (see contract 1's own
# comment on dependency inversion) -- never meant to depend on each
# other at all.
[[tool.importlinter.contracts]]
name = "the concrete adapters stay independent of each other"
type = "independence"
modules = ["adapters.ollama_adapter", "adapters.sqlite_adapter"]


# ---------------------------------------------------------------
# THE SIMULATOR'S OWN CONTRACTS (sim/), moved here when it adopted
# Elysium's toolchain. They are unchanged: eight contracts describing
# sim/simulator's internal layering, which `simulator` in
# root_packages above makes analysable from this root.
# ---------------------------------------------------------------

[[tool.importlinter.contracts]]
name = "engine layering: scheduler and lifecycle sit on clock and rng"
type = "layers"
layers = ["scheduler | lifecycle", "clock | rng"]
containers = ["simulator"]

# The silo layer. simulator.silo holds the contract and nothing else;
# the concrete kinds implement it and must never import each other.
#
# That sibling rule is the load-bearing half. MariaDbSilo and
# PostgresSilo have a similar SHAPE, and the tempting move the first
# time they both need something is for one to import from the other, or
# for a shared "sql base" to appear between them. Both would be wrong:
# they differ in initialisation, in whether a control program exists, in
# how shutdown is issued, and in how readiness is established. What they
# genuinely share is the Silo contract, and a contract is the only thing
# they should share.
#
# `|` between siblings, not `:`. A colon lists siblings that MAY import
# each other; a pipe lists siblings that may not. They read almost
# identically and mean opposite things, and a negative control caught
# that the wrong way round once already.
#
# connection and process sit BELOW the five, which is the shape the
# measurement asked for: they hold what was identical between the two
# SQL silos, and the five stay independent of each other. They are
# siblings of each other too -- connection sharing and process
# supervision are different concerns and neither should reach for the
# other.
[[tool.importlinter.contracts]]
name = "concrete silos implement the contract and stay independent of each other"
type = "layers"
layers = ["postgres | mariadb | sqlite | filedrop | rest",
          "connection | process | logs"]
containers = ["simulator.silos"]

# dialect renders what schema declares, so it sits above it; schema is a
# leaf and must stay one. A schema module that reached for a dialect
# would mean declarations knowing which engine they were destined for,
# which is the entire distinction these two modules exist to draw.
[[tool.importlinter.contracts]]
name = "drift sits on relational sits on dialect sits on schema"
type = "layers"
layers = ["drift | oracle", "relational", "dialect", "schema"]
containers = ["simulator"]

# The value layer. expression resolves its names through context, so it
# sits above it; context must stay a leaf. A context that reached for
# the expression evaluator would mean the reference language depending
# on the arithmetic that consumes it, and the two would stop being
# separable -- which matters because templates use the same resolver
# and must not drag arithmetic along with it.
[[tool.importlinter.contracts]]
name = "generators sit on expression sits on context"
type = "layers"
layers = ["generators", "expression", "context"]
containers = ["simulator"]

# The spec package sits on top of everything it describes -- schema,
# lifecycle, scheduler, generators, silos -- and nothing may depend on
# it. A pack file describes the engine; the engine must not know that
# pack files exist, or the agnostic rule is gone by another route.
# runner sits on world sits on everything else. The world holds state
# and does not schedule; the runner drives it. A world reaching for the
# runner would mean state depending on the thing that changes it, and
# the world would stop being inspectable without running anything.
[[tool.importlinter.contracts]]
name = "cli sits on console sits on runner sits on world"
type = "layers"
layers = ["cli", "console", "runner", "world", "audit"]
containers = ["simulator"]

[[tool.importlinter.contracts]]
name = "nothing in the engine depends on the pack spec"
type = "forbidden"
source_modules = [
    "simulator.schema", "simulator.dialect", "simulator.relational",
    "simulator.generators", "simulator.expression", "simulator.context",
    "simulator.lifecycle", "simulator.scheduler", "simulator.clock",
    "simulator.rng", "simulator.silo", "simulator.silos", "simulator.ports",
]
forbidden_modules = ["simulator.spec"]

# model is data; loader turns a file into it. A model that reached for
# the loader would mean the parsed form depending on the parser, which
# is what makes a spec inspectable without the machinery that built it.
[[tool.importlinter.contracts]]
name = "the spec model knows nothing about the loader"
type = "forbidden"
source_modules = ["simulator.spec.model"]
forbidden_modules = ["simulator.spec.loader"]

[[tool.importlinter.contracts]]
name = "the silo contract knows nothing about any concrete silo"
type = "forbidden"
source_modules = ["simulator.silo"]
forbidden_modules = ["simulator.silos"]

