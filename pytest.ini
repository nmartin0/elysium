[pytest]
markers =
    integration: slow tests that require a real Ollama server running locally
    mocked_llm: fast tests exercising the full AgentLoop/API wiring with the LLM mocked out
    postgres: needs a real PostgreSQL installation (initdb, pg_ctl) -- sim
    mariadb: needs a real MariaDB or MySQL installation (mariadbd) -- sim

# THE SIMULATOR RUNS UNDER THIS CONFIGURATION TOO. sim/ was grafted
# in from elysium-sim with its own pyproject, lint.sh, requirements
# and locks. Those collided: its `mypy<2` downgraded Elysium's type
# checker by a major version whenever either project's requirements
# were installed, so one of them had to give and it was not going to
# be Elysium. sim now uses this file, this toolchain and these pins.
testpaths =
    tests
    sim/tests

# sim/ ON THE PATH, so `import simulator` resolves from THIS root. The
# package lives at sim/simulator, and its tests and conftest import it
# by bare name -- which needed no help when sim was its own repository
# and its root was the working directory.
pythonpath =
    .
    sim

# TEMPORARY DIRECTORIES FOR PASSING TESTS ARE REMOVED AT ONCE; failures
# keep theirs, so there is something to inspect. Not tidiness: every test
# that starts a silo initialises a real PostgreSQL or MariaDB cluster,
# tens of megabytes each, and pytest's default keeps the last three
# runs. Measured: 6.1 GB of temporary data after one run, and a second
# run on a machine with less free space fails in fixture setup with "No
# space left on device" -- 138 errors that look like a code problem.
#
# THIS USED TO SIT IN pyproject.toml, WHERE IT DID NOTHING: with a
# pytest.ini present, pytest reads that alone and says so -- "ignoring
# pytest config in pyproject.toml!" -- which nobody acted on until the
# owner's paste of 23 October. Meanwhile a disk filled in this project's
# own runs: 3.6 GB in one run's temporary directory, 19 GB in the
# simulator's.
tmp_path_retention_policy = failed

norecursedirs =
    .git
    *.egg-info
    # hypothesis's saved examples and mutmut's working copy (DEP-2).
    .hypothesis
    mutants
