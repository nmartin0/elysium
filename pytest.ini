[pytest]
markers =
    integration: slow tests that require a real Ollama server running locally
    mocked_llm: fast tests exercising the full AgentLoop/API wiring with the LLM mocked out

# THE SIMULATOR KEEPS ITS OWN SUITE. sim/ is a whole project with its
# own pyproject.toml, lint.sh, requirements and tests, grafted in
# whole rather than copied. Its conftest imports `simulator`, which is
# only on the path from sim/'s own root -- so a bare `pytest` here
# collected it and ERRORED before running anything.
#
# `testpaths` applies only when no path is given on the command line,
# so `pytest tests/unit` and `pytest sim/tests` both still do exactly
# what they say. This just fixes what a bare `pytest` means.
testpaths =
    tests

# BELT AND BRACES: keep sim/ out of any recursive walk, including
# --collect-only and any tool that honours this.
norecursedirs =
    sim
    .git
    *.egg-info
