[pytest]
markers =
    integration: slow tests that require a real Ollama server running locally
    mocked_llm: fast tests exercising the full AgentLoop/API wiring with the LLM mocked out
    postgres: needs a real PostgreSQL installation (initdb, pg_ctl) -- sim
    mariadb: needs a real MariaDB or MySQL installation (mariadbd) -- sim

# THE SIMULATOR RUNS UNDER THIS CONFIGURATION TOO. sim/ was grafted
# in from elysium-sim with its own pyproject, lint.sh, requirements
# and locks. Those collided: its `mypy<2` downgraded Elysium's type
# checker by a major version whenever either project's requirements
# were installed, so one of them had to give and it was not going to
# be Elysium. sim now uses this file, this toolchain and these pins.
testpaths =
    tests
    sim/tests

# sim/ ON THE PATH, so `import simulator` resolves from THIS root. The
# package lives at sim/simulator, and its tests and conftest import it
# by bare name -- which needed no help when sim was its own repository
# and its root was the working directory.
pythonpath =
    .
    sim

norecursedirs =
    .git
    *.egg-info
