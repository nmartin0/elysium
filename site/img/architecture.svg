<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 -70 940 520"
  role="img"
  aria-labelledby="arch-title arch-desc"
>
  <title id="arch-title">How Elysium is arranged</title>
  <desc id="arch-desc">
    Three stacked planes seen at an angle. The top plane is the ontology you declare:
    object types with their fields, and the rule naming which field decides who may see
    a row. The middle plane is the mirror Elysium keeps current in three stages — bronze
    holds every raw value as the source wrote it, silver is typed and standardised, and
    gold is the single published table each object type is read from. The bottom plane is
    your own databases, which the pipeline only ever reads. A question travels down
    through the ontology, which decides what the asking user may see, and is answered
    from gold. A write travels the other way as a proposal a person approves, and only
    then reaches your database.
  </desc>

  <style>
    /* ISOMETRIC, AND THE GEOMETRY IS COMPUTED RATHER THAN EYEBALLED.
       Every coordinate comes from one projection at 30 degrees with a
       single squash factor, generated by a script. Hand-placed
       isometric points are what make a diagram look subtly wrong in a
       way nobody can name. */
    .slab      { fill: var(--d-slab, #121a2b); stroke: var(--d-line, #243352); }
    .slab-side { fill: var(--d-side, #0d1320); stroke: var(--d-line, #243352); }
    .slab-side--dark { fill: var(--d-side-dark, #090d16); }
    .chip      { fill: var(--d-chip, #1b2740); stroke: var(--d-line, #243352); }
    .chip--accent { stroke: var(--d-accent, #4d8dff); fill: var(--d-chip-accent, #16233f); }
    .slab, .slab-side, .chip { stroke-width: 1; }
    .chip-label {
      fill: var(--d-ink, #f7f6f3); font-size: 13px; font-weight: 500;
      text-anchor: middle; font-family: var(--font-sans, sans-serif);
    }
    .chip-sub {
      fill: var(--d-soft, #9aa5bb); font-size: 10.5px; text-anchor: middle;
      font-family: var(--font-mono, monospace);
    }
    .layer-label {
      fill: var(--d-faint, #6b788f); font-size: 11px; letter-spacing: .12em;
      font-family: var(--font-mono, monospace);
    }
    .layer-name {
      fill: var(--d-ink, #f7f6f3); font-size: 17px; font-weight: 600;
      font-family: var(--font-sans, sans-serif);
    }
    .flow { stroke: var(--d-accent, #4d8dff); fill: none; stroke-width: 1.5; }
    .flow-label {
      fill: var(--d-soft, #9aa5bb); font-size: 11.5px;
      font-family: var(--font-mono, monospace);
    }
  </style>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--d-accent, #4d8dff)" />
    </marker>
  </defs>

    <polygon class="slab-side" points="470.0,230.0 210.2,317.0 210.2,331.0 470.0,244.0" />
    <polygon class="slab-side slab-side--dark" points="210.2,317.0 470.0,404.0 470.0,418.0 210.2,331.0" />
    <polygon class="slab" points="470.0,230.0 729.8,317.0 470.0,404.0 210.2,317.0" />
    <polygon class="chip" points="470.0,241.6 573.9,276.4 474.3,309.8 370.4,274.9" />
    <text class="chip-label" x="472.2" y="277.7">PostgreSQL</text>

    <polygon class="chip" points="591.2,282.2 695.2,317.0 595.6,350.3 491.7,315.5" />
    <text class="chip-label" x="593.4" y="318.3">MySQL</text>

    <polygon class="chip" points="353.1,280.8 457.0,315.5 357.4,348.9 253.5,314.1" />
    <text class="chip-label" x="355.3" y="316.8">SQLite</text>

    <polygon class="chip" points="474.3,321.3 578.3,356.1 478.7,389.5 374.7,354.7" />
    <text class="chip-label" x="476.5" y="357.4">your warehouse</text>

    <polygon class="slab-side" points="470.0,90.0 210.2,177.0 210.2,191.0 470.0,104.0" />
    <polygon class="slab-side slab-side--dark" points="210.2,177.0 470.0,264.0 470.0,278.0 210.2,191.0" />
    <polygon class="slab" points="470.0,90.0 729.8,177.0 470.0,264.0 210.2,177.0" />
    <polygon class="chip" points="470.0,101.6 695.2,177.0 634.5,197.3 409.4,121.9" />
    <text class="chip-label" x="552.3" y="151.4">bronze</text>
    <text class="chip-sub" x="552.3" y="165.4">every raw value</text>

    <polygon class="chip" points="392.1,127.7 617.2,203.1 556.6,223.4 331.4,148.0" />
    <text class="chip-label" x="474.3" y="177.5">silver</text>
    <text class="chip-sub" x="474.3" y="191.5">typed, standardised</text>

    <polygon class="chip chip--accent" points="314.1,153.8 539.3,229.2 478.7,249.5 253.5,174.1" />
    <text class="chip-label" x="396.4" y="203.6">gold</text>
    <text class="chip-sub" x="396.4" y="217.6">the read path</text>

    <polygon class="slab-side" points="470.0,-50.0 210.2,37.0 210.2,51.0 470.0,-36.0" />
    <polygon class="slab-side slab-side--dark" points="210.2,37.0 470.0,124.0 470.0,138.0 210.2,51.0" />
    <polygon class="slab" points="470.0,-50.0 729.8,37.0 470.0,124.0 210.2,37.0" />
    <polygon class="chip" points="470.0,-38.4 573.9,-3.6 478.7,28.3 374.7,-6.5" />
    <text class="chip-label" x="474.3" y="-3.0999999999999996">Customer</text>
    <text class="chip-sub" x="474.3" y="10.9">name · region</text>

    <polygon class="chip" points="591.2,2.2 695.2,37.0 599.9,68.9 496.0,34.1" />
    <text class="chip-label" x="595.6" y="37.5">Transaction</text>
    <text class="chip-sub" x="595.6" y="51.5">amount · date</text>

    <polygon class="chip chip--accent" points="357.4,-0.7 582.6,74.7 478.7,109.5 253.5,34.1" />
    <text class="chip-label" x="418.0" y="56.4">security: region</text>
    <text class="chip-sub" x="418.0" y="70.4">who may see a row</text>


  <!-- layer names, set off to the left so they never sit on the art -->
  <text class="layer-label" x="20" y="-18">YOU DECLARE</text>
  <text class="layer-name"  x="20" y="4">Ontology</text>

  <text class="layer-label" x="20" y="142">ELYSIUM KEEPS CURRENT</text>
  <text class="layer-name"  x="20" y="164">Mirror</text>

  <text class="layer-label" x="20" y="282">YOU OWN, AND KEEP</text>
  <text class="layer-name"  x="20" y="304">Your databases</text>

  <!-- the two flows, down the right -->
  <path class="flow" d="M 880 10 L 880 150" marker-end="url(#a)" />
  <text class="flow-label" x="872" y="80" text-anchor="end">a question, as a named user</text>

  <path class="flow" d="M 880 170 L 880 300" marker-end="url(#a)" />
  <text class="flow-label" x="872" y="240" text-anchor="end">an approved write, only then</text>
</svg>
