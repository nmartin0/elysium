<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520"
  role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">How data reaches a question</title>
  <desc id="arch-desc">
    A flow from left to right in four columns. On the left, your own data silos, declared
    in data_silos.yaml — here two databases holding three tables between them: customers
    and transactions in primary_sql, risk_scores in risk_db. Next, bronze: Elysium mirrors
    each source table one-to-one, ingested as-is with no preprocessing. Next, silver: the
    same tables at the same grain, with values typed and standardised and any schema drift
    reported. Next, gold: the shape changes. Gold holds one table per object type, keyed by
    the object's id and using the ontology's property names, joining the silos a type spans
    — Customer here is assembled from customers in primary_sql and risk_scores in risk_db.
    Each gold table is written to a branch, audited, and published by a single commit, so a
    reader never sees half a build. Above all of it sits the ontology you declare, which is
    what a question is asked against: it names the object types, their fields and links, and
    the grant each field requires. Reads are served from gold and filtered to the asking
    user. The sync only ever reads your silos.
  </desc>

  <style>
    .box { fill: var(--d-box, #141d30); stroke: var(--d-line, #243352); stroke-width: 1; }
    .box--silo { fill: var(--d-silo, #0f1626); stroke-dasharray: 3 3; }
    .box--gold { stroke: var(--d-accent, #4d8dff); fill: var(--d-gold, #16233f); }
    .name { fill: var(--d-ink, #f7f6f3); font-size: 13px; font-weight: 500;
             font-family: var(--font-sans, sans-serif); }
    .sub  { fill: var(--d-faint, #6b788f); font-size: 10.5px;
             font-family: var(--font-mono, monospace); }
    .col  { fill: var(--d-ink, #f7f6f3); font-size: 12px; font-weight: 600;
             letter-spacing: .11em; font-family: var(--font-mono, monospace); }
    .colsub { fill: var(--d-faint, #6b788f); font-size: 10.5px;
               font-family: var(--font-mono, monospace); }
    .wire { fill: none; stroke: var(--d-line-bright, #2b3c63); stroke-width: 1.25; }
    .wire--gold { stroke: var(--d-accent, #4d8dff); }
    .onto { fill: var(--d-onto, #16233f); stroke: var(--d-accent, #4d8dff); }
    .ontolabel { fill: var(--d-ink, #f7f6f3); font-size: 14px; font-weight: 600;
                  font-family: var(--font-sans, sans-serif); }
    .note { fill: var(--d-soft, #9aa5bb); font-size: 11px;
             font-family: var(--font-mono, monospace); }
  </style>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5"
            orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--d-line-bright, #2b3c63)"/>
    </marker>
  </defs>

  <text class="col" x="40" y="58">YOUR SILOS</text>
  <text class="colsub" x="40" y="78">declared in data_silos.yaml</text>
  <text class="col" x="300" y="58">BRONZE</text>
  <text class="colsub" x="300" y="78">ingested as-is, 1 : 1</text>
  <text class="col" x="560" y="58">SILVER</text>
  <text class="colsub" x="560" y="78">typed, standardised</text>
  <text class="col" x="820" y="58">GOLD</text>
  <text class="colsub" x="820" y="78">one table per object type</text>
  <rect class="box box--silo" x="40" y="120" width="196" height="52" rx="3"/>
  <text class="name" x="56" y="142">customers</text>
  <text class="sub"  x="56" y="159">primary_sql</text>
  <rect class="box" x="300" y="120" width="196" height="52" rx="3"/>
  <text class="name" x="316" y="142">customers</text>
  <text class="sub" x="316" y="159">primary_sql.customers</text>
  <rect class="box" x="560" y="120" width="196" height="52" rx="3"/>
  <text class="name" x="576" y="142">customers</text>
  <text class="sub" x="576" y="159">typed</text>
  <rect class="box box--silo" x="40" y="206" width="196" height="52" rx="3"/>
  <text class="name" x="56" y="228">transactions</text>
  <text class="sub"  x="56" y="245">primary_sql</text>
  <rect class="box" x="300" y="206" width="196" height="52" rx="3"/>
  <text class="name" x="316" y="228">transactions</text>
  <text class="sub" x="316" y="245">primary_sql.transactions</text>
  <rect class="box" x="560" y="206" width="196" height="52" rx="3"/>
  <text class="name" x="576" y="228">transactions</text>
  <text class="sub" x="576" y="245">typed</text>
  <rect class="box box--silo" x="40" y="292" width="196" height="52" rx="3"/>
  <text class="name" x="56" y="314">risk_scores</text>
  <text class="sub"  x="56" y="331">risk_db</text>
  <rect class="box" x="300" y="292" width="196" height="52" rx="3"/>
  <text class="name" x="316" y="314">risk_scores</text>
  <text class="sub" x="316" y="331">risk_db.risk_scores</text>
  <rect class="box" x="560" y="292" width="196" height="52" rx="3"/>
  <text class="name" x="576" y="314">risk_scores</text>
  <text class="sub" x="576" y="331">typed</text>
  <rect class="box box--gold" x="820" y="120" width="196" height="70" rx="3"/>
  <text class="name" x="836" y="142">Customer</text>
  <text class="sub" x="836" y="159">joined from 2 silos</text>
  <rect class="box box--gold" x="820" y="250" width="196" height="52" rx="3"/>
  <text class="name" x="836" y="272">Transaction</text>
  <text class="sub" x="836" y="289">ontology's names</text>
  <path class="wire" d="M 236 146 C 268.0 146, 268.0 146, 300 146" marker-end="url(#a)"/>
  <path class="wire" d="M 496 146 C 528.0 146, 528.0 146, 560 146" marker-end="url(#a)"/>
  <path class="wire" d="M 236 232 C 268.0 232, 268.0 232, 300 232" marker-end="url(#a)"/>
  <path class="wire" d="M 496 232 C 528.0 232, 528.0 232, 560 232" marker-end="url(#a)"/>
  <path class="wire" d="M 236 318 C 268.0 318, 268.0 318, 300 318" marker-end="url(#a)"/>
  <path class="wire" d="M 496 318 C 528.0 318, 528.0 318, 560 318" marker-end="url(#a)"/>
  <path class="wire wire--gold" d="M 756 146 C 788.0 146, 788.0 155.0, 820 155.0" marker-end="url(#a)"/>
  <path class="wire wire--gold" d="M 756 318 C 788.0 318, 788.0 155.0, 820 155.0" marker-end="url(#a)"/>
  <path class="wire wire--gold" d="M 756 232 C 788.0 232, 788.0 276.0, 820 276.0" marker-end="url(#a)"/>

  <!-- THE ONTOLOGY, spanning the width above gold: it is what the
       question is asked against, and it is the only layer the customer
       writes. -->
  <rect class="onto" x="40" y="398" width="1016" height="78" rx="4"/>
  <text class="ontolabel" x="60" y="426">Ontology — object types, fields, links, and the grant each field needs</text>
  <text class="note" x="60" y="450">a question is asked against this, as a named user — and answered from gold, filtered to them</text>
  <text class="note" x="60" y="468">security: region &#183; read:Customer.email &#183; the ontology decides, never the model</text>

  <path class="wire wire--gold" d="M 918 398 L 918 318" marker-end="url(#a)"/>

  <text class="note" x="40" y="500">the sync only ever READS your silos &#183; a write is a proposal a person approves, and lands back in the silo</text>
</svg>
