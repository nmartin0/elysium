  <text class="colsub" x="40" y="84">data_silos.yaml</text>
  <text class="col" x="330" y="64">BRONZE</text>
  <text class="colsub" x="330" y="84">ingested as-is, 1:1</text>
  <text class="col" x="560" y="64">SILVER</text>
  <text class="colsub" x="560" y="84">typed, standardised</text>
  <text class="col" x="790" y="64">GOLD</text>
  <text class="colsub" x="790" y="84">one per object type</text>
  <text class="col" x="1030" y="64">ONTOLOGY</text>
  <text class="colsub" x="1030" y="84">what you ask</text>
  <path class="cyl" d="M 40 129 L 40 193 A 54.0 11 0 0 0 148 193 L 148 129 Z"/>
  <ellipse class="cyl-top" cx="94.0" cy="129" rx="54.0" ry="11"/>
  <path class="cyl-line" d="M 40 150.33333333333334 A 54.0 11 0 0 0 148 150.33333333333334"/>
  <path class="cyl-line" d="M 40 171.66666666666666 A 54.0 11 0 0 0 148 171.66666666666666"/>
  <text class="name" x="94.0" y="226" text-anchor="middle">primary_sql</text>
  <text class="sub" x="94.0" y="242" text-anchor="middle">customers, transactions</text>
  <path class="cyl" d="M 172 129 L 172 193 A 54.0 11 0 0 0 280 193 L 280 129 Z"/>
