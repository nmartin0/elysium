<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 440"
  role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">From your databases to a question</title>
  <desc id="arch-desc">
    A left-to-right flow in five columns. On the left, your own data silos drawn as
    databases: primary_sql holding customers and transactions, risk_db holding risk_scores.
    Elysium reads them and never writes to them. Next, bronze mirrors each source table
    one-to-one, as the source wrote it. Next, silver holds the same tables at the same
    grain with values typed and standardised. Next, gold, where the shape changes: one
    table per object type using the ontology's property names, joining the silos a type
    spans, so Customer is assembled from customers in primary_sql and risk_scores in
    risk_db. At the end of the line, the ontology — the distillation everything feeds. It
    names the object types, their fields and links, and the grant each field requires, and
    it is what a question is asked against. A write travels back the other way as a
    proposal a person approves.
  </desc>

  <style>
    .box { fill: var(--d-box, #141d30); stroke: var(--d-line, #243352); stroke-width: 1; }
    .box--gold { stroke: var(--d-accent, #4d8dff); fill: var(--d-gold, #16233f); }
    .cyl { fill: var(--d-silo, #101828); stroke: var(--d-line-bright, #2b3c63); }
    .cyl-top { fill: var(--d-silo-top, #1a2742); stroke: var(--d-line-bright, #2b3c63); }
    .cyl-line { fill: none; stroke: var(--d-line, #243352); stroke-width: 1; }
    .onto { fill: var(--d-onto, #16233f); stroke: var(--d-accent, #4d8dff); stroke-width: 1.5; }
    .name { fill: var(--d-ink, #f7f6f3); font-size: 12.5px; font-weight: 500;
            font-family: var(--font-sans, sans-serif); }
    .sub  { fill: var(--d-faint, #6b788f); font-size: 10px;
            font-family: var(--font-mono, monospace); }
    .col  { fill: var(--d-ink, #f7f6f3); font-size: 11.5px; font-weight: 600;
            letter-spacing: .12em; font-family: var(--font-mono, monospace); }
    .colsub { fill: var(--d-faint, #6b788f); font-size: 10px;
              font-family: var(--font-mono, monospace); }
    .wire { fill: none; stroke: var(--d-line-bright, #2b3c63); stroke-width: 1.25; }
    .wire--gold { stroke: var(--d-accent, #4d8dff); }
    .onto-name { fill: var(--d-ink, #f7f6f3); font-size: 15px; font-weight: 600;
                 font-family: var(--font-sans, sans-serif); }
    .onto-line { fill: var(--d-soft, #9aa5bb); font-size: 11px;
                 font-family: var(--font-mono, monospace); }
    .foot { fill: var(--d-faint, #6b788f); font-size: 10.5px;
            font-family: var(--font-mono, monospace); }
  </style>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5"
            orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--d-line-bright, #2b3c63)"/>
    </marker>
  </defs>

