<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 20 1240 400"
          role="img" aria-labelledby="arch-title arch-desc">
          <title id="arch-title">From your databases to the ontology</title>
          <desc id="arch-desc">
          A left-to-right flow. On the left, your own databases: primary_sql holding customers
          and transactions, risk_db holding risk_scores. Elysium reads them and never writes to them. Elysium reads them and never writes to
          them. Each source table keeps its own horizontal lane through two stages — bronze,
          which mirrors it exactly as the source wrote it, and silver, where values are typed
          and standardised. Then gold, where the shape changes: one table per object type using
          the ontology's property names. Customer is assembled from the customers table and the
          risk_scores table, which is the single place two lanes join. At the end sits the
          ontology: the object types, their fields and links, and the grant each field requires.
          It is what a question is asked against, and the only thing on this diagram you write.
          </desc>
          <style>
          .box { fill: var(--d-box, #141d30); stroke: var(--d-line, #26324d); stroke-width: 1; }
          .box--accent { fill: var(--d-onto, #121c33); stroke: var(--d-accent, #4d8dff); }
          .cyl { fill: var(--d-silo, #101828); stroke: var(--d-line, #26324d); }
          .cyl-top { fill: var(--d-silo-top, #1a2742); stroke: var(--d-line, #26324d); }
          .cyl-line { fill: none; stroke: var(--d-line, #26324d); }
          .name { fill: var(--d-ink, #f7f6f3); font-size: 13px; font-weight: 500;
          font-family: var(--font-sans, sans-serif); }
          .sub { fill: var(--d-faint, #6b788f); font-size: 10px;
          font-family: var(--font-mono, monospace); }
          .silo-name { fill: var(--d-soft, #9aa5bb); font-size: 11px;
          font-family: var(--font-mono, monospace); }
          .col { fill: var(--d-faint, #6b788f); font-size: 10.5px; letter-spacing: .14em;
          font-family: var(--font-mono, monospace); }
          .wire { fill: none; stroke: var(--d-line-bright, #2f3e63); stroke-width: 1.25; }
          .wire--in { stroke: var(--d-accent, #4d8dff); }
          .onto-h { fill: var(--d-ink, #f7f6f3); font-size: 14px; font-weight: 600;
          font-family: var(--font-sans, sans-serif); }
          .onto-l { fill: var(--d-soft, #9aa5bb); font-size: 11px;
          font-family: var(--font-mono, monospace); }
          </style>
          
