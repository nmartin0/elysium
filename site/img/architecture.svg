  <path class="cyl-line" d="M 172 150.33333333333334 A 54.0 11 0 0 0 280 150.33333333333334"/>
  <path class="cyl-line" d="M 172 171.66666666666666 A 54.0 11 0 0 0 280 171.66666666666666"/>
  <text class="name" x="226.0" y="226" text-anchor="middle">risk_db</text>
  <text class="sub" x="226.0" y="242" text-anchor="middle">risk_scores</text>
  <rect class="box" x="330" y="132" width="170" height="54" rx="2"/>
  <text class="name" x="344" y="155">customers</text>
  <text class="sub" x="344" y="172">as the source wrote it</text>
  <rect class="box" x="560" y="132" width="170" height="54" rx="2"/>
  <text class="name" x="574" y="155">customers</text>
  <text class="sub" x="574" y="172">typed</text>
  <rect class="box" x="330" y="224" width="170" height="54" rx="2"/>
  <text class="name" x="344" y="247">transactions</text>
  <text class="sub" x="344" y="264">as the source wrote it</text>
  <rect class="box" x="560" y="224" width="170" height="54" rx="2"/>
  <text class="name" x="574" y="247">transactions</text>
  <text class="sub" x="574" y="264">typed</text>
  <rect class="box" x="330" y="316" width="170" height="54" rx="2"/>
  <text class="name" x="344" y="339">risk_scores</text>
  <text class="sub" x="344" y="356">as the source wrote it</text>
  <rect class="box" x="560" y="316" width="170" height="54" rx="2"/>
  <text class="name" x="574" y="339">risk_scores</text>
  <text class="sub" x="574" y="356">typed</text>
  <rect class="box box--gold" x="790" y="132" width="170" height="76" rx="2"/>
  <text class="name" x="804" y="155">Customer</text>
  <text class="sub" x="804" y="172">joined from 2 silos</text>
  <rect class="box box--gold" x="790" y="270" width="170" height="54" rx="2"/>
  <text class="name" x="804" y="293">Transaction</text>
  <text class="sub" x="804" y="310">ontology's names</text>
  <path class="wire" d="M 148 161 C 239.0 161, 239.0 159, 330 159" marker-end="url(#a)"/>
  <path class="wire" d="M 500 159 C 530.0 159, 530.0 159, 560 159" marker-end="url(#a)"/>
  <path class="wire" d="M 148 161 C 239.0 161, 239.0 251, 330 251" marker-end="url(#a)"/>
  <path class="wire" d="M 500 251 C 530.0 251, 530.0 251, 560 251" marker-end="url(#a)"/>
  <path class="wire" d="M 280 161 C 305.0 161, 305.0 343, 330 343" marker-end="url(#a)"/>
  <path class="wire" d="M 500 343 C 530.0 343, 530.0 343, 560 343" marker-end="url(#a)"/>
  <path class="wire wire--gold" d="M 730 159 C 760.0 159, 760.0 170.0, 790 170.0" marker-end="url(#a)"/>
  <path class="wire wire--gold" d="M 730 343 C 760.0 343, 760.0 170.0, 790 170.0" marker-end="url(#a)"/>
  <path class="wire wire--gold" d="M 730 251 C 760.0 251, 760.0 297.0, 790 297.0" marker-end="url(#a)"/>
  <rect class="onto" x="1030" y="118" width="186" height="268" rx="3"/>
  <path class="wire wire--gold" d="M 960 170.0 C 995.0 170.0, 995.0 252, 1030 252" marker-end="url(#a)"/>
  <path class="wire wire--gold" d="M 960 297.0 C 995.0 297.0, 995.0 252, 1030 252" marker-end="url(#a)"/>

  <text class="onto-name" x="1050" y="152">Ontology</text>
  <text class="onto-line" x="1050" y="182">Customer</text>
  <text class="onto-line" x="1050" y="200">  name  region  email</text>
  <text class="onto-line" x="1050" y="218">  transactions &#8594;</text>
  <text class="onto-line" x="1050" y="246">Transaction</text>
  <text class="onto-line" x="1050" y="264">  amount  currency</text>
  <text class="onto-line" x="1050" y="296">security: region</text>
  <text class="onto-line" x="1050" y="314">read:Customer.email</text>
  <text class="onto-line" x="1050" y="348">a question is asked</text>
  <text class="onto-line" x="1050" y="366">against this, as you</text>

  <text class="foot" x="40" y="422">Elysium only ever READS your silos &#183; a write is a proposal a person approves, and lands back where it came from</text>
</svg>
