# CONTINUOUS INTEGRATION (E-09).
#
# Every job starts from a FRESH CHECKOUT -- no seeded deployment, no
# synced mirror, nothing a developer's working copy accumulates. That is
# the condition E-08 needed and never had: thirty unit tests passed only
# where a server had once seeded deployment/var/lib, and reported green
# from exactly those working copies.
#
# WHAT IT DOES NOT RUN: tests marked `integration` in pytest.ini, which
# need a real Ollama server. They are deselected here as they are by
# default locally.

name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # 3.12: what the lock files were generated for and every test has
      # run on. INSTALL.md said "3.10 or later" when this was written and
      # nothing tested it; it says 3.12 now, which is what pyproject had
      # required all along, and a test holds the two files together.
      # Twenty-six modules import `datetime.UTC`, so 3.10 could never
      # have imported the package at all.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # FROM THE HASHED LOCK: CI installs exactly what is pinned, and
      # refuses anything whose hash differs.
      - name: Install dependencies
        run: pip install --require-hashes -r requirements-dev.lock

      - name: Lint (ruff, mypy, vulture, lock files, import-linter)
        run: ./lint.sh

      - name: Unit tests
        run: python -m pytest tests/unit -q

      - name: Integration tests (no model server)
        run: python -m pytest tests/integration -q -m "not integration"

      # THE WRITING HALF OF E-08, checked behaviourally. Tests that write
      # into the developer's deployment PASS, so no test result shows it;
      # the tripwires in tests/unit find the calls, and this finds the
      # effect. Exact here and only here: on a developer's machine a
      # running server writes into deployment/ too.
      #
      # AFTER BOTH TIERS. It sat between them at first: the integration
      # tests wrote there too -- importing api.app built a whole
      # application against the default deployment (E-08c).
      - name: The tests created nothing in deployment/
        run: |
          created="$(git status --porcelain --ignored deployment/ | grep -v __pycache__ || true)"
          if [ -n "$created" ]; then
            echo "The test suite created files in the deployment directory:"
            echo "$created"
            exit 1
          fi

  # THE DECLARED CONTROLS, in their own job because they are slow.
  #
  # MEASURED, not guessed: a control takes between 2 and 18 seconds
  # depending on how large a test slice it runs, so seventy of them is
  # on the order of ten minutes. That is why this is a separate job
  # running beside the others rather than steps appended to `backend`.
  #
  # Each one breaks a guarantee on purpose and runs the tests that must
  # notice. A control that PASSES is the finding: either the break was
  # not the break it claimed, or the tests do not check what they
  # appear to.
  #
  # DELIBERATELY NOT IN lint.sh, which has to stay fast enough that
  # people run it. CI is where a minutes-long check belongs, and until
  # this ran nothing invoked the seventy controls at all -- they
  # worked and no mechanism exercised them.
  controls:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --require-hashes -r requirements-dev.lock

      - name: The controls fire
        run: python -m scripts.check_controls

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ui/.nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      # JUDGED BY EXIT STATUS, which is all a CI step can be judged by --
      # the lesson of patch 303, where counting "error TS" missed a
      # broken lint for twenty-three patches.
      - name: Lint (oxlint, typecheck, format, knip)
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build
