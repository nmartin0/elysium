# ontology_schema.yaml  (TEMPLATE -- copy into deployment/etc/ and edit)
#
# Declares what data EXISTS and how it's structured -- it does NOT by
# itself make anything visible to the LLM. Every field listed here,
# including each object type's own id_field, needs a matching
# read:<Type>.<field> grant in policy.yaml before any user can ever see
# it. A field declared here with no matching grant anywhere simply
# never appears to the LLM at all -- see core/ontology/mediator.py's
# visible_schema() docstring for the full reasoning.
#
# Each type's "storage" block holds ONLY its physical backing --
# everything else in a type's entry is purely SEMANTIC (what it means,
# how it relates to other types). Keeping these visibly separate means
# editing what an Employee IS never requires also understanding SQL
# table names, and vice versa.
#
# This example (Employee/ExpenseReport) is a REAL, working schema --
# replace it with your own object types once you've confirmed the
# pipeline works end to end.

object_types:
  Employee:
    # Display metadata is entirely OPTIONAL -- omit it and Elysium
    # derives a readable label from the name ("full_name" becomes "Full
    # Name"). Declare it when the derived label is wrong or too terse,
    # which is what these three exist for.
    display_name: Employee
    plural_display_name: Employees
    description: Someone who works here and can file expenses.
    storage:
      silo: primary_sql             # must match a name under data_silos.yaml
      table: employees               # the real table name
      id_column: employee_id
    id_field: employee_id           # the identifier's name -- see policy.yaml's
                                     # header for why this ISN'T automatically
                                     # safe to expose without its own grant
    title_field: full_name          # OPTIONAL -- which field's own VALUE stands
                                     # in as a human-readable display name (e.g.
                                     # "Ada Okafor," not the raw employee_id) in
                                     # the UI's own Browse/Object View. Must
                                     # reference a real, plain `type: data` field
                                     # (or the id_field itself) -- checked at
                                     # load time. Still needs its OWN explicit
                                     # read:Employee.full_name grant like any
                                     # other field before it's ever shown --
                                     # declaring it here only says WHICH field
                                     # would be the title, never makes its own
                                     # value visible on its own.
    security:
      field: department             # MAC boundary -- this object type carries
                                     # its own boundary value directly. The
                                     # OTHER option is `via_field: <link>` (see
                                     # ExpenseReport below) -- follow a link to
                                     # find the object that carries it instead.
    fields:
      department:
        type: data
      full_name:
        type: data
        # A field can carry its own label and description too. Both
        # optional; both surface in the UI and in what the agent is
        # told about the ontology.
        display_name: Name
        description: The employee's full name, as it appears on payroll.

  Project:
    display_name: Project
    plural_display_name: Projects
    storage:
      silo: primary_sql
      table: projects
      id_column: project_id
    id_field: project_id
    title_field: name
    security:
      field: department
    fields:
      name:
        type: data
      department:
        type: data

  ExpenseReport:
    display_name: Expense Report
    plural_display_name: Expense Reports
    storage:
      silo: primary_sql
      table: expense_reports
      id_column: report_id
      # id_type declares what the ID COLUMN holds, and matters for the
      # same reason data_type does -- an integer key read back as a
      # string breaks comparisons and link lookups. Both keys here are
      # text, which is the default, so neither declares it. If yours is
      # an INTEGER PRIMARY KEY, add: id_type: integer
    id_field: report_id
    security:
      via_field: employee_id        # this type doesn't carry its own boundary
                                     # value -- it inherits the linked
                                     # Employee's department instead
    fields:
      amount:
        type: data
        # data_type tells the mirror what this field really holds, so a
        # number stays a number rather than becoming a string. Optional
        # -- undeclared fields are treated as text -- but declare it for
        # anything you will sum, compare, or sort.
        # One of: string, integer, number, boolean.
        data_type: number
        display_name: Amount
      status:
        type: data

# NAMED ACTION TYPES -- the ONLY way an LLM-driven agent may ever
# change data (see write_mediator.py's own module docstring). Each
# action is a NAMED, independently-governed operation with its own
# execute:<ActionName> grant in policy.yaml -- there is no generic,
# free-form "write this field" mechanism at all.
#
# Every action_type declares "sub_writes" -- a list of one or more
# objects it touches, each with its own object_type/object_id/
# operation/mutations. This is required for EVERY action, even one
# touching only a single object (like both examples below) -- there
# is no separate, flatter shorthand: the object(s) an action touches
# are always just ordinary parameters, matching Palantir Foundry's
# own action model directly (verified against their own docs: "an
# existing object whose primary key is derived from object reference
# parameters" -- never a separate, special field). A parameter that
# identifies an object is declared with type: object_reference,
# naming which object_type it refers to.
#
# A mutation's "value" is one of three kinds -- the two most important
# to understand are both demonstrated below, deliberately, so this
# template teaches the real distinction rather than picking just one
# (a plain LITERAL, the third kind, is self-explanatory and not shown
# separately):
#   - a LITERAL, used as-is
#   - "parameter.<name>", one of the action's own declared parameters,
#     supplied by the MODEL at invocation time (UpdateEmployeeDepartment
#     below lets the caller freely choose the new department)
#   - "user.security_value", the ACTING user's own MAC value,
#     substituted automatically -- NEVER model-supplied. The only safe
#     way to populate a new object's security field on a "create"
#     action (CreateEmployee below scopes every new hire to the
#     acting hr_admin's OWN department, matching their existing MAC
#     boundary) -- a literal would hardcode one department for every
#     admin; a parameter reference would let the model assign a new
#     hire to a department the acting user has no authority over at
#     all.

link_types:
  # A MANY-TO-MANY link: an employee works on several projects and a
  # project has several employees, so neither table can hold the
  # other's key. It is backed by a join table of key pairs -- which
  # must contain ONLY those two columns; anything else stored there
  # means the relationship is really two one-to-many links through a
  # third object type.
  EmployeeProjects:
    display_name: Projects
    source: {object_type: Employee, api_name: projects}
    target: {object_type: Project, api_name: employees}
    cardinality: many_to_many
    join_table:
      table: employee_projects
      source_column: employee_id
      target_column: project_id

  # Link types are first-class ontology entities: ONE declaration, both
  # directions generated from it. See core/ontology/link_types.py.
  EmployeeExpenseReports:
    display_name: Expense Reports
    source: {object_type: Employee, api_name: expense_reports}
    target: {object_type: ExpenseReport, api_name: employee_id}
    cardinality: one_to_many
    foreign_key_column: employee_id


action_types:
  UpdateEmployeeDepartment:
    affected_object_types: [Employee]
    parameters:
      employee_id:
        type: object_reference
        object_type: Employee
        required: true
      new_department:
        type: string
        required: true
    sub_writes:
      - object_type: Employee
        object_id: parameter.employee_id
        operation: update
        mutations:
          - set: {property: department, value: parameter.new_department}
  CreateEmployee:
    affected_object_types: [Employee]
    parameters:
      employee_id:
        type: object_reference
        object_type: Employee
        required: true
      full_name:
        type: string
        required: true
    sub_writes:
      - object_type: Employee
        object_id: parameter.employee_id
        operation: create
        mutations:
          - set: {property: employee_id, value: parameter.employee_id}
          - set: {property: full_name, value: parameter.full_name}
          - set: {property: department, value: user.security_value}

  # DELETE removes an object from the ontology WITHOUT deleting the row
  # from your database. Elysium records the removal in its own write
  # log; your source data is never destroyed, and a later write to the
  # same object makes it visible again. That is deliberate -- Elysium
  # does not write destructively to systems it does not own.
  #
  # A delete names an object and declares no mutations: there is
  # nothing to change, only something to remove.
  RemoveExpenseReport:
    affected_object_types:
      - ExpenseReport
    parameters:
      report_id:
        type: object_reference
        object_type: ExpenseReport
        required: true
    sub_writes:
      - object_type: ExpenseReport
        object_id: $report_id
        operation: delete
