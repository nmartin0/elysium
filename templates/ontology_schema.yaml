# ontology_schema.yaml  (TEMPLATE -- copy into deployment/etc/ and edit)
#
# Declares what data EXISTS and how it's structured -- it does NOT by
# itself make anything visible to the LLM. Every field listed here,
# including each object type's own id_field, needs a matching
# read:<Type>.<field> grant in policy.yaml before any user can ever see
# it. A field declared here with no matching grant anywhere simply
# never appears to the LLM at all -- see core/ontology/mediator.py's
# visible_schema() docstring for the full reasoning.
#
# Each type's "storage" block holds ONLY its physical backing --
# everything else in a type's entry is purely SEMANTIC (what it means,
# how it relates to other types). Keeping these visibly separate means
# editing what an Employee IS never requires also understanding SQL
# table names, and vice versa.
#
# This example (Employee/ExpenseReport) is a REAL, working schema --
# replace it with your own object types once you've confirmed the
# pipeline works end to end.

object_types:
  Employee:
    storage:
      silo: primary_sql             # must match a name under data_silos.yaml
      table: employees               # the real table name
      id_column: employee_id
    id_field: employee_id           # the identifier's name -- see policy.yaml's
                                     # header for why this ISN'T automatically
                                     # safe to expose without its own grant
    security:
      field: department             # MAC boundary -- this object type carries
                                     # its own boundary value directly. The
                                     # OTHER option is `via_field: <link>` (see
                                     # ExpenseReport below) -- follow a link to
                                     # find the object that carries it instead.
    fields:
      department:
        type: data
      full_name:
        type: data
      expense_reports:
        type: link                  # a reverse relationship -- NOT a real
        target: ExpenseReport       # column on this table, needs via_table/
        cardinality: many           # via_column to say where to find the rows
        via_table: expense_reports
        via_column: employee_id

  ExpenseReport:
    storage:
      silo: primary_sql
      table: expense_reports
      id_column: report_id
    id_field: report_id
    security:
      via_field: employee_id        # this type doesn't carry its own boundary
                                     # value -- it inherits the linked
                                     # Employee's department instead
    fields:
      amount:
        type: data
      status:
        type: data
      employee_id:
        type: link                  # a forward reference -- a real foreign-key
        target: Employee             # column on THIS table (cardinality: one)
        cardinality: one

# NAMED ACTION TYPES -- the ONLY way an LLM-driven agent may ever
# change data (see write_mediator.py's own module docstring). Each
# action is a NAMED, independently-governed operation with its own
# execute:<ActionName> grant in policy.yaml -- there is no generic,
# free-form "write this field" mechanism at all.
#
# Every action_type declares "sub_writes" -- a list of one or more
# objects it touches, each with its own object_type/object_id/
# operation/mutations. This is required for EVERY action, even one
# touching only a single object (like both examples below) -- there
# is no separate, flatter shorthand: the object(s) an action touches
# are always just ordinary parameters, matching Palantir Foundry's
# own action model directly (verified against their own docs: "an
# existing object whose primary key is derived from object reference
# parameters" -- never a separate, special field). A parameter that
# identifies an object is declared with type: object_reference,
# naming which object_type it refers to.
#
# A mutation's "value" is one of three kinds -- the two most important
# to understand are both demonstrated below, deliberately, so this
# template teaches the real distinction rather than picking just one
# (a plain LITERAL, the third kind, is self-explanatory and not shown
# separately):
#   - a LITERAL, used as-is
#   - "parameter.<name>", one of the action's own declared parameters,
#     supplied by the MODEL at invocation time (UpdateEmployeeDepartment
#     below lets the caller freely choose the new department)
#   - "user.security_value", the ACTING user's own MAC value,
#     substituted automatically -- NEVER model-supplied. The only safe
#     way to populate a new object's security field on a "create"
#     action (CreateEmployee below scopes every new hire to the
#     acting hr_admin's OWN department, matching their existing MAC
#     boundary) -- a literal would hardcode one department for every
#     admin; a parameter reference would let the model assign a new
#     hire to a department the acting user has no authority over at
#     all.
action_types:
  UpdateEmployeeDepartment:
    affected_object_types: [Employee]
    parameters:
      employee_id:
        type: object_reference
        object_type: Employee
        required: true
      new_department:
        type: string
        required: true
    sub_writes:
      - object_type: Employee
        object_id: parameter.employee_id
        operation: update
        mutations:
          - set: {property: department, value: parameter.new_department}
  CreateEmployee:
    affected_object_types: [Employee]
    parameters:
      employee_id:
        type: object_reference
        object_type: Employee
        required: true
      full_name:
        type: string
        required: true
    sub_writes:
      - object_type: Employee
        object_id: parameter.employee_id
        operation: create
        mutations:
          - set: {property: employee_id, value: parameter.employee_id}
          - set: {property: full_name, value: parameter.full_name}
          - set: {property: department, value: user.security_value}
