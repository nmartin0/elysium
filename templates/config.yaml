# config.yaml  (TEMPLATE -- copy into deployment/etc/ and edit)
#
# Operational settings: which LLM backend and model each call uses,
# and agent-loop tuning. Which data silo(s) this deployment reads from
# lives in its own, separate data_silos.yaml -- see that file's own
# header for why.

llm:
  # Two backends ship: "ollama" (a local model over HTTP) and
  # "claude_agent_sdk" (runs the local claude CLI, so calls draw on
  # your Claude subscription's Agent SDK credit rather than separately
  # billed API credits -- see INSTALL.md for setup).
  provider: ollama                 # key into core/deployment_loader.py's LLM
                                    # adapter registry -- see that file's
                                    # _LLM_ADAPTER_REGISTRY for what's built in
  #
  # OR `vllm`, FOR CONCURRENT USERS ON A GPU. At one request the two
  # are within about 20%, and Ollama is often faster to first token
  # because it has no scheduler queue; past four to eight concurrent
  # requests vLLM leads by two to nine times, because it batches
  # continuously rather than queuing (SCALABILITY.md). Its connection
  # wants an OpenAI-style endpoint:
  #
  #   provider: vllm
  #   connection:
  #     base_url: "http://gpu-host:8000/v1/chat/completions"
  #     api_key: "${VLLM_API_KEY}"   # only if the endpoint wants one
  #
  # AND THE AGENT'S CONCURRENCY FOLLOWS THE ENGINE unless you set it:
  # 4 for ollama, matching llama.cpp's own parallel cap, and 16 for
  # vllm, which wants requests in flight.
  connection:
    base_url: "http://localhost:11434/api/chat"
    request_timeout_seconds: 600   # local CPU-only inference can be genuinely
                                    # slow. A 1300-token prompt at the ~5 tokens
                                    # /sec prompt-eval rate measured on a 2-vCPU
                                    # VM is ~4 minutes BEFORE the model writes
                                    # anything; 240 timed out on the first hop
    keep_alive: -1                 # keep the model resident between calls. The
                                    # default evicts after five minutes, and the
                                    # agent loop can idle longer than that
                                    # between hops on slow hardware. A reload
                                    # was measured at 12-47 seconds
    options: {}                    # passed straight through to the provider.
                                    # num_thread and num_ctx are the ones worth
                                    # setting on constrained hardware; leave
                                    # empty to use the provider's own defaults

  # ONE model for every call. Two models mean the provider loading and
  # evicting between them, which on CPU-only hardware costs more than
  # any difference between the two models.
  #
  # Deliberation is turned OFF for every call (the adapter sends
  # think: false), so a reasoning model does not emit a chain of
  # thought before each answer. A deployment that genuinely wants one
  # can set  under llm_connection options below.
  #
  # Choose a NON-REASONING model. Measured on a 2-vCPU VM, asked to
  # reply with a single word: phi4-mini emitted 2 tokens, gemma4:e2b
  # 84, qwen3.5:2b 370. At ~1.5 tokens/sec generation the token COUNT
  # dominates, not the model's benchmark scores.
  #
  # Faster per token is NOT the same as better. qwen2.5:3b measured 36%
  # faster on prompt evaluation and was still rejected: on a multi-hop
  # question it repeated a step it had already been corrected on until
  # the loop stopped it, and never produced an answer.
  model: "phi4-mini"

  # A deployment wanting a different model for each job may name
  # step_model and synthesis_model INSTEAD of model. Naming both forms
  # is rejected at load rather than resolved by precedence.

agent:
  max_hops: 8                       # hard ceiling on steps per question
  max_consecutive_duplicates: 2     # corrective nudges before giving up if the
                                     # model keeps repeating an identical step
  max_consecutive_invalid_steps: 2  # same, for requesting something invalid
  # REQUIRES A RESTART to take effect, unlike every other setting in
  # this file. A ThreadPoolExecutor's size is fixed when it is built,
  # and the pool is deliberately NOT rebuilt by a configuration reload
  # -- rebuilding it would abandon whatever work is in flight.
  #
  # Editing this and reloading changes the reported configuration
  # without changing the running pool. Said here rather than left to
  # be discovered, because a setting that silently does not apply is
  # worse than one that plainly cannot.
  max_concurrent_requests: 4        # thread pool size for api/ and
                                     # scripts/serve_requests.py

# How proposed writes behave while they wait for a decision.
writes:
  # REQUIRES A RESTART to take effect, like max_concurrent_requests
  # above: the pending-write store survives a configuration reload
  # deliberately, and rebuilding it to pick up a new TTL would discard
  # every proposal currently waiting for someone to decide on it.
  #
  # Four hours by default. Fifteen minutes was right when a proposer
  # confirmed their own write seconds later, and is wrong for an
  # approvals queue -- the point of four-eyes is that the reviewer is
  # somebody else, and somebody else is not necessarily at their desk.
  #
  # A proposal that expires is audited either way, never silently
  # dropped.
  pending_write_ttl_minutes: 240

# Tools the LLM may call, by name -- entirely optional; omitting this
# section (or listing none) is completely valid, unlike llm:, which
# every deployment needs. Registered tools live in
# core/tools/registry.py.
tools:
  enabled:
    - linear_regression

# HOW MANY NAMED GOLD PUBLICATIONS TO KEEP (OPEN_RISKS item 3).
# Thirty is a month of nightlies: long enough to answer "what did this
# look like when the report was wrong", short enough that the list
# stays readable. 0 keeps every one.
#
# IT BOUNDS THE LIST, NOT THE DISK. The snapshots themselves are not
# removed -- PyIceberg 0.12's ExpireSnapshots expires nothing, which
# was measured rather than assumed (see core/mirror/gold.py). The
# changelog is unaffected either way: what CHANGED lives in its own
# table, so forgetting a publication loses the ability to read the
# table as it WAS, not the record of what happened.
#
# mirror:
#   retain_publications: 30
