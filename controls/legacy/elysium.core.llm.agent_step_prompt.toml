[[control]]
id = 'LEG-0102'
describes = 'AR-5: next_step sends the schema when constrained'
invariant = 'none'
kind = 'mechanical'
path = 'src/elysium/core/llm/agent_step_prompt.py'
old = '                           if constrain else True),'
new = '                           if False else True),'
tests = [
    'tests/unit/test_step_schema.py::TestItReachesTheServer::test_next_step_passes_a_schema_only_when_constrained',
]
expect = "fails"

