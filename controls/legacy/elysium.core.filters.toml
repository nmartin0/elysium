[[control]]
id = 'LEG-0512'
describes = 'HOURS: hours on a date field are refused'
invariant = 'none'
kind = 'mechanical'
path = 'src/elysium/core/filters.py'
old = '    if "hours" in units and declared_type == "date":'
new = '    if False:'
tests = [
    'tests/unit/test_relative_hours.py::TestValidation::test_hours_on_a_date_are_refused_by_name',
]
expect = "fails"

