[[control]]
id = 'LEG-0822'
describes = "ADD-ON: a server gets a bare environment, none of Elysium's secrets"
invariant = 'none'
kind = 'semantic'
path = 'src/elysium/api/addon_servers.py'
old = '        environment = {name: os.environ[name] for name in ENVIRONMENT_KEPT if name in os.environ}'
new = '        environment = dict(os.environ)'
tests = [
    'tests/integration/test_addon_lifecycle.py::test_it_starts_the_server_with_what_the_contract_promises',
]
expect = "fails"

[[control]]
id = 'LEG-0823'
describes = 'ADD-ON: a server ignoring SIGTERM is killed at its deadline'
invariant = 'none'
kind = 'semantic'
path = 'src/elysium/api/addon_servers.py'
old = '''
            self._signal(signal.SIGKILL)
            status = self.process.wait()'''
new = '            status = None'
tests = [
    'tests/integration/test_addon_lifecycle.py::test_one_ignoring_sigterm_is_killed_at_its_deadline',
]
expect = "fails"

[[control]]
