[[control]]
id = 'LEG-0832'
describes = "OUTBOX: an add-on's notice reaches only people offered the module"
invariant = 'none'
kind = 'semantic'
path = 'src/elysium/api/addon_servers.py'
old = '[n for n in message.to if n in offered]'
new = 'list(message.to)'
tests = [
    'tests/integration/test_addon_outbox.py::test_a_name_not_offered_the_module_is_dropped_and_counted_not_named',
]
expect = "fails"

[[control]]
id = 'LEG-0833'
describes = 'OUTBOX: a file read twice is delivered once'
invariant = 'none'
kind = 'semantic'
path = 'src/elysium/api/addon_servers.py'
old = 'dedupe_key=outbox_dedupe_key(module.id, path.name, user_id)) is not None:'
new = ') is not None:'
tests = [
    'tests/integration/test_addon_outbox.py::test_a_file_read_twice_is_delivered_once',
]
expect = "fails"

[[control]]
id = 'LEG-0834'
describes = 'OUTBOX: a notice left while the server is down is still delivered'
