[[control]]
id = 'LEG-0505'
describes = 'WINDOWS: a wake is never sooner than a minute'
invariant = 'none'
kind = 'semantic'
path = 'src/elysium/core/trigger_windows.py'
old = '    due = max(crossing.timestamp(), now.timestamp() + MIN_SPACING_SECONDS)'
new = '    due = crossing.timestamp()'
tests = [
    'tests/integration/test_trigger_windows.py::TestTheCrossing::test_never_sooner_than_a_minute',
]
expect = "fails"

[[control]]
id = 'LEG-0506'
describes = 'WINDOWS: nothing left to cross clears the timer'
invariant = 'none'
kind = 'semantic'
path = 'src/elysium/core/trigger_windows.py'
old = '''
        timers.cancel(KIND, trigger.trigger_id)
        return None'''
new = '        return None'
tests = [
    'tests/integration/test_trigger_windows.py::TestItSetsATimerForTheNextCrossing::test_nothing_left_to_cross_means_no_timer',
]
