[[control]]
id = 'LEG-0515'
describes = "HOURS: a trigger's timer reads the window in its own unit"
invariant = 'none'
kind = 'semantic'
path = 'src/elysium/core/trigger_windows.py'
old = '                crossing = earliest + span'
new = '                crossing = earliest + span * 24'
tests = [
    'tests/unit/test_relative_hours.py::TestOneHelperForEveryReader::test_a_trigger_wakes_when_a_record_turns_n_hours_old',
]
expect = "fails"
