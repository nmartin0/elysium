[[control]]
id = 'LEG-0371'
describes = 'FLAKE-1: a batched source read is one statement, so a write mid-read cannot tear it'
invariant = 'none'
kind = 'semantic'
path = 'src/elysium/adapters/sqlite_adapter.py'
old = '''
        cursor = conn.execute(sql, params)
        while batch := cursor.fetchmany(batch_size):
            yield [dict(row) for row in batch]
'''
new = '''
        done = 0
        while batch := conn.execute(sql, params).fetchall()[done:done + batch_size]:
            done += len(batch)
            yield [dict(row) for row in batch]
'''
tests = [
    'tests/unit/test_sync_snapshot_semantics.py::test_the_sync_reads_a_consistent_snapshot_under_concurrent_source_writes',
]
expect = "fails"
