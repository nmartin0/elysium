[[control]]
id = 'LEG-0197'
describes = 'R2 state: a recorded rebuild reads as rebuilding without the sync lock'
invariant = 'none'
kind = 'semantic'
path = 'src/elysium/core/mirror/object_state.py'
old = '        return REBUILDING if sync_running else LIVE'
new = '        return REBUILDING'
tests = [
    'tests/unit/test_object_state.py::TestTableState::test_a_recorded_rebuild_is_rebuilding_only_while_a_sync_runs',
    'tests/integration/test_retype_from_the_ui.py::TestTheStateWhenItCannotBeTold::test_a_rebuild_that_died_is_not_rebuilding_for_ever',
]
expect = "fails"

