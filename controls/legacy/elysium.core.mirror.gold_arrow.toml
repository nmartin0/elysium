describes = 'gold refuses a publication that lost most of its rows'
invariant = 'none'
kind = 'mechanical'
path = 'src/elysium/core/mirror/gold_arrow.py'
old = '    if previous_count and table.num_rows < previous_count * (1 - MAX_DELETED_FRACTION):'
new = '    if False:'
