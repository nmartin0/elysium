[[control]]
id = 'LEG-0748'
describes = 'CSV: a latest-shaped table reads only the newest file'
invariant = 'none'
kind = 'semantic'
path = 'src/elysium/adapters/csv_folder_adapter.py'
old = '        return files[-1:] if self._spec(table_name)["shape"] == "latest" else files'
new = '        return files'
tests = [
    'tests/unit/test_csv_folder_adapter.py::TestTheTwoShapes::test_latest_reads_only_the_newest_file',
]
expect = "fails"

