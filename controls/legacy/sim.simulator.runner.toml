        due = _SHARED_REFRESH.get(name)
        if due is not None and elapsed - due < spec.refresh_seconds:
            continue
        _SHARED_REFRESH[name] = elapsed'''
tests = [
    'sim/tests/test_replicas.py::test_two_worlds_do_not_share_a_refresh_clock',
]
expect = "fails"

