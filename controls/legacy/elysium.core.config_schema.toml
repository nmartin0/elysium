[[control]]
id = 'LEG-1138'
describes = 'an unknown configuration key is refused, not ignored'
invariant = 'none'
kind = 'mechanical'
path = 'src/elysium/core/config_schema.py'
old = '''
    model_config = ConfigDict(extra="forbid")
'''
new = '''
    model_config = ConfigDict(extra="ignore")
'''
tests = [
    'tests/unit/test_config_schema.py::test_a_misspelt_key_is_named_with_its_file_path_and_nearest_key',
    'tests/unit/test_config_schema.py::test_the_loader_refuses_a_misspelt_setting',
]
expect = "fails"

