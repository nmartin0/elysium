[[control]]
id = 'LEG-0214'
describes = 'R3 count: a bronze table that is not there counts as zero'
invariant = 'none'
kind = 'semantic'
path = 'src/elysium/core/mirror/retype_count.py'
old = '        return not_counted("bronze does not hold this table yet, so there is nothing to count")'
new = '        return ConversionCount(name, column, True, 0, 0, None)'
tests = [
    'tests/unit/test_retype_count.py::TestTheCount::test_a_table_bronze_does_not_hold_is_not_counted_and_says_why_never_zero',
    'tests/integration/test_retype_from_the_ui.py::TestRetyping::test_a_table_bronze_does_not_hold_is_said_to_be_not_counted_and_never_zero',
]
expect = "fails"
