[[control]]
id = 'LEG-0210'
describes = 'R3 count: values that fail are not added to the count'
invariant = 'none'
kind = 'semantic'
path = 'src/elysium/core/mirror/retype_count.py'
old = '            failing += len(result.mismatched_row_indices)'
new = '            failing += 0'
tests = [
    'tests/unit/test_retype_count.py::TestTheCount::test_values_that_are_not_numbers_are_counted_out_of_all_the_values_read',
    'tests/integration/test_retype_from_the_ui.py::TestWhatHappensToStoredData::test_values_that_will_not_convert_are_counted_and_nothing_is_written',
]
expect = "fails"

[[control]]
id = 'LEG-0211'
describes = 'R3 count: a table too large to count is counted in part'
