[[control]]
id = 'LEG-0307'
describes = 'DEP-4: a phone number is checked against its region'
invariant = 'none'
kind = 'semantic'
path = 'src/elysium/core/ontology/value_checks.py'
old = '    return number if phonenumbers.is_valid_number(number) else None'
new = '    return number'
tests = [
    'tests/unit/test_reference_data_checks.py::TestPhoneNumbers::test_a_number_that_cannot_exist_is_refused_naming_the_region',
]
expect = "fails"

[[control]]
