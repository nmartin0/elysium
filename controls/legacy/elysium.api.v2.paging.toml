[[control]]
id = 'LEG-1155'
describes = 'v2 paging: a page token is compared as bytes, so a non-ASCII one is invalid not a 500'
invariant = 'none'
kind = 'semantic'
path = 'src/elysium/api/v2/paging.py'
old = '''
    if not hmac.compare_digest(presented, expected):
'''
new = '''
    if not hmac.compare_digest(signature, _signature(key, user_id, query, payload)):
'''
tests = [
    'tests/unit/test_v2_paging.py::test_a_token_that_is_not_ascii_is_invalid_not_a_fault[abc.\xe9]',
    'tests/integration/test_api_v2.py::TestPageTokens::test_a_token_that_is_not_ascii_is_the_same_refusal_not_a_fault',
]
expect = "fails"
