[[control]]
id = 'LEG-1120'
describes = 'v2 paging: a page token is bound to the caller it was issued to'
invariant = 'none'
kind = 'semantic'
path = 'src/elysium/api/v2/paging.py'
old = '''
    message = "\0".join([user_id, query, payload]).encode()
'''
new = '''
    message = "\0".join([query, payload]).encode()
'''
tests = [
    'tests/unit/test_v2_paging.py::test_another_caller_cannot_use_it',
    'tests/integration/test_api_v2.py::TestPageTokens::test_another_user_cannot_use_my_token',
]
expect = "fails"

