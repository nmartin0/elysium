[[control]]
id = 'LEG-0498'
describes = 'TIMERS: a timer moved while it fired is kept'
invariant = 'none'
kind = 'semantic'
path = 'src/elysium/core/timers.py'
old = '''
                "DELETE FROM timers WHERE kind = ? AND key = ? AND due_at = ?",
                (timer.kind, timer.key, timer.due_at),'''
new = '''
                "DELETE FROM timers WHERE kind = ? AND key = ?",
                (timer.kind, timer.key),'''
tests = [
    'tests/unit/test_timers.py::test_done_keeps_a_timer_moved_while_it_fired',
]
expect = "fails"

[[control]]
id = 'LEG-0499'
describes = 'TIMERS: a failing timer is dropped after its attempts'
invariant = 'none'
kind = 'semantic'
path = 'src/elysium/core/timers.py'
old = '''
            self.done(timer)
            return False'''
new = '            return False'
tests = [
    'tests/unit/test_timers.py::test_a_failure_is_retried_later_then_dropped',
]
expect = "fails"

[[control]]
id = 'LEG-0500'
describes = "TIMERS: setting one wakes this process's loop"
invariant = 'none'
kind = 'semantic'
path = 'src/elysium/core/timers.py'
old = '''
        for listener in list(_listeners):
            try:
                listener(float(due_at))'''
new = '''
        for listener in []:
            try:
                listener(float(due_at))'''
tests = [
    'tests/unit/test_timers.py::test_this_process_is_told_when_a_timer_is_set',
]
expect = "fails"

[[control]]
id = 'LEG-0521'
describes = 'REPEAT: a retry keeps its occurrence, so its key'
invariant = 'none'
kind = 'mechanical'
path = 'src/elysium/core/timers.py'
old = '                "UPDATE timers SET due_at = ?, attempts = attempts + 1 "'
new = '                "UPDATE timers SET due_at = ?, occurrence_at = due_at + 1, attempts = attempts + 1 "'
tests = [
    'tests/integration/test_timer_service.py::TestARepeatingTimer::test_a_retry_is_the_same_occurrence',
]
expect = "fails"

[[control]]
id = 'LEG-0524'
describes = 'REMINDERS: nobody else cancels yours'
invariant = 'none'
kind = 'semantic'
path = 'src/elysium/core/timers.py'
old = '''
                "DELETE FROM timers WHERE kind = ? AND key = ? AND owner_user_id = ?",
                (kind, key, owner_user_id))'''
new = '''
                "DELETE FROM timers WHERE kind = ? AND key = ?",
                (kind, key))'''
tests = [
    'tests/integration/test_reminder_routes.py::test_nobody_else_sees_or_cancels_it',
]
expect = "fails"
