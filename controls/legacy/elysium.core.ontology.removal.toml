[[control]]
id = 'LEG-0142'
describes = "removal dialog: says a later erasure still reaches the removed type's tables"
invariant = 'I6'
kind = 'semantic'
path = 'src/elysium/core/ontology/removal.py'
old = '    "A later erasure request still reaches these tables,'
new = '    "A later erasure request cannot reach these tables,'
tests = [
    'tests/unit/test_removal.py::TestWhatATypeLeavesBehind::test_it_says_source_untouched_the_tables_stay_and_nothing_serves_it',
]
expect = "fails"

