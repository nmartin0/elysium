new = '    found = [replace(row, subjects=tuple(name for name in row.subjects if True))'
tests = [
    'tests/unit/test_removal.py::TestWhatBlocksAWholeType::test_the_types_own_fields_are_not_hidden_from_the_person_asking',
]
expect = "fails"

