[[control]]
id = 'LEG-1025'
describes = 'a check that could not be made (no write log) blocks rather than passes'
invariant = 'none'
kind = 'semantic'
path = 'src/elysium/core/ontology/removal.py'
old = '''
    if write_log is None:
        return [Referrer(PENDING_WRITE, "write log",'''
new = '''
    if write_log is None:
        return []
    if False:
        return [Referrer(PENDING_WRITE, "write log",'''
tests = [
    'tests/unit/test_removal.py::test_without_a_write_log_it_cannot_be_told_and_that_blocks',
]
expect = "fails"

[[control]]
id = 'LEG-1026'
describes = 'a blocker is shown only if every name it carries is one the person could find'
invariant = 'none'
kind = 'semantic'
path = 'src/elysium/core/ontology/removal.py'
old = '    shown = [item for item in blockers if all(knows(subject) for subject in item.subjects)]'
new = '    shown = list(blockers)'
tests = [
    'tests/unit/test_removal.py::TestWhatThePersonMaySee::test_a_row_naming_one_unknown_name_is_counted_and_not_shown',
    'tests/integration/test_removal_from_the_ui.py::TestNothingIsLeakedToSomeoneWhoCannotDiscoverTheName::test_blockers_naming_what_they_cannot_discover_are_counted_not_named',
]
expect = "fails"
