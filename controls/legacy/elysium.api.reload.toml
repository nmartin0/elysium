[[control]]
id = 'LEG-0259'
describes = 'Live: following a publication rebuilds from the running configuration, not disk'
invariant = 'none'
kind = 'semantic'
path = 'src/elysium/api/reload.py'
old = '''
            new = build_generation(scratch, app.state.runtime_paths.data_dir,
                                   app.state.runtime_paths.log_dir)'''
new = '''
            new = build_generation(app.state.runtime_paths.config_dir,
                                   app.state.runtime_paths.data_dir,
                                   app.state.runtime_paths.log_dir)'''
tests = [
    'tests/integration/test_live_updates.py::test_following_a_publication_never_applies_an_unreloaded_edit',
]
expect = "fails"

[[control]]
id = 'LEG-0260'
describes = 'Live: a new publication is served without a restart'
invariant = 'none'
kind = 'semantic'
path = 'src/elysium/api/reload.py'
old = '''
        app.state.generation = new
        record_generation(app.state.config_history, new)
        current.mediator'''
new = '''
        record_generation(app.state.config_history, new)
        current.mediator'''
tests = [
    'tests/integration/test_live_updates.py::test_a_new_publication_is_served_without_a_restart',
]
expect = "fails"

