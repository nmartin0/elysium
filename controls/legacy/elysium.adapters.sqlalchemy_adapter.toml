[[control]]
id = 'LEG-0272'
describes = 'R4: a supported database is read as one snapshot'
invariant = 'none'
kind = 'semantic'
path = 'src/elysium/adapters/sqlalchemy_adapter.py'
old = '        isolation = SNAPSHOT_ISOLATION.get(self._engine.dialect.name)'
new = '        isolation = None'
tests = [
    'tests/unit/test_one_consistent_read_per_silo.py::test_a_write_between_two_reads_is_not_seen_inside_the_snapshot',
]
expect = "fails"

[[control]]
id = 'LEG-0273'
describes = 'R4: a failed read inside the snapshot costs only that read'
invariant = 'none'
kind = 'semantic'
path = 'src/elysium/adapters/sqlalchemy_adapter.py'
old = '''
                with pinned.begin_nested():
                    return [dict(row) for row in pinned.execute(statement).mappings()]'''
new = '                return [dict(row) for row in pinned.execute(statement).mappings()]'
tests = [
    'tests/unit/test_one_consistent_read_per_silo.py::test_a_failed_read_does_not_poison_the_rest_of_the_snapshot',
]
expect = "fails"

[[control]]
id = 'LEG-0278'
