    'tests/unit/test_derived_fields.py::TestWhoMayReadOne::test_a_role_that_cannot_read_an_input_cannot_read_the_result',
    'tests/unit/test_derived_fields.py::TestThroughARealDeployment::test_a_role_without_an_input_is_refused_the_result',
]
expect = "fails"

[[control]]
id = 'LEG-0303'
describes = 'R37: an empty input is an empty result, not zero'
invariant = 'none'
kind = 'semantic'
path = 'src/elysium/core/ontology/derived_fields.py'
old = '''
    if left is None or right is None:
        return None'''
new = '''
    if left is None or right is None:
        left, right = left or 0, right or 0'''
tests = [
    'tests/unit/test_derived_fields.py::TestTheFormulas::test_an_empty_input_is_an_empty_result_not_zero',
]
expect = "fails"

