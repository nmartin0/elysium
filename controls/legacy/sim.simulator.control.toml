[[control]]
id = 'LEG-0773'
describes = 'SIM: live drift goes through the world, so the business follows it'
invariant = 'none'
kind = 'semantic'
path = 'sim/simulator/control.py'
old = '''
    world.apply_change(silo_name, change)
'''
new = '''
    world.schemas[silo_name] = change.apply(world.silo(silo_name), world.database(silo_name), world.schema(silo_name), world.clock.now())
'''
tests = [
    'sim/tests/test_control.py::test_a_live_rename_is_followed_by_the_business_and_its_exports',
]
expect = "fails"

