[[control]]
id = 'LEG-0772'
describes = "SIM: an export's header follows a live rename"
invariant = 'none'
kind = 'semantic'
path = 'sim/simulator/event.py'
old = '''
    header = [now for now in (world.lineage.column(silo_name, table_name, name)
                              for name in columns) if now is not None]'''
new = '    header = list(columns)'
tests = [
    'sim/tests/test_control.py::test_a_live_rename_is_followed_by_the_business_and_its_exports',
]
expect = "fails"
