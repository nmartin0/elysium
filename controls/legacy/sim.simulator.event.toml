[[control]]
id = 'LEG-0017'
describes = 'an export with a window reaches back only that far'
invariant = 'none'
kind = 'mechanical'
path = 'sim/simulator/event.py'
old = '''
    if window is not None:
        window_column = world.lineage.column(silo_name, table_name, window.column)'''
new = '''
    if False:
        window_column = world.lineage.column(silo_name, table_name, window.column)'''
tests = [
    'sim/tests/test_field_service.py::test_the_payroll_file_holds_real_pay_lines',
]
expect = "fails"

[[control]]
id = 'LEG-0032'
describes = "an update's pick is read fresh, not from the cache"
invariant = 'none'
kind = 'semantic'
path = 'sim/simulator/event.py'
old = '''
    rows = fetch_all(silo, world.database(silo_name),
                     f"SELECT {selected} FROM {dialect.quote(table.name)}") if table else []'''
new = '''
    rows = [tuple(row.get(name) for name in names)
            for row in world.subject_rows(qualified)]'''
tests = [
    'sim/tests/test_runner.py::test_an_updates_pick_sees_rows_written_during_the_run',
]
expect = "fails"

