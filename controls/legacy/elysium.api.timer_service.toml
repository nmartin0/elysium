kind = 'mechanical'
path = 'src/elysium/api/timer_service.py'
old = '''
    if timer.repeat is None:
        return None
    from elysium.core.timer_rules import next_occurrence

    anchor = datetime.fromtimestamp(timer.occurrence_at, UTC)
    after'''
