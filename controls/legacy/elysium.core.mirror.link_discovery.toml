[[control]]
id = 'LEG-0419'
describes = 'R54: a column already declared as a link is not suggested again'
invariant = 'none'
kind = 'semantic'
path = 'src/elysium/core/mirror/link_discovery.py'
old = '                if (fields.get(field_name) or {}).get("type") == "link" or field_name == security:'
new = '                if field_name == security:'
tests = [
    'tests/unit/test_link_discovery.py::test_a_declared_link_is_not_suggested_again',
]
expect = "fails"

[[control]]
id = 'LEG-0420'
describes = 'R54: a column of a few values is not taken for a link'
invariant = 'none'
kind = 'mechanical'
path = 'src/elysium/core/mirror/link_discovery.py'
old = '                if len(values) < MIN_DISTINCT:'
new = '                if False:'
tests = [
    'tests/unit/test_link_discovery.py::test_a_column_of_few_values_is_not_a_link',
]
