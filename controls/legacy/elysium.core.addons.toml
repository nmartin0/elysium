[[control]]
id = 'LEG-0815'
describes = "ADD-ON: the browser's cookie and a forged identity never reach an add-on"
invariant = 'none'
kind = 'semantic'
path = 'src/elysium/core/addons.py'
old = '    "accept", "accept-encoding", "accept-language", "cache-control",'
new = '    "cookie", "x-elysium-identity", "accept", "accept-encoding", "accept-language", "cache-control",'
tests = [
    'tests/integration/test_addon_proxy.py::test_the_add_on_is_told_who_is_asking_and_nothing_of_the_session',
]
expect = "fails"

[[control]]
id = 'LEG-0816'
describes = "ADD-ON: an add-on cannot set a cookie on Elysium's origin"
invariant = 'none'
kind = 'semantic'
path = 'src/elysium/core/addons.py'
old = '    "cache-control", "content-disposition", "content-encoding", "content-language",'
new = '    "set-cookie", "cache-control", "content-disposition", "content-encoding", "content-language",'
tests = [
    'tests/integration/test_addon_proxy.py::test_no_cookie_and_no_loopback_address_come_back_and_what_does_is_sandboxed',
]
expect = "fails"

[[control]]
id = 'LEG-0819'
describes = 'ADD-ON: an identity token expires, so one copied out of a log is good for a minute'
invariant = 'none'
kind = 'semantic'
path = 'src/elysium/core/addons.py'
old = '"iat": issued, "exp": issued + TOKEN_SECONDS,'
new = '"iat": issued, "exp": issued + 10**9,'
tests = [
    'tests/unit/test_addons.py::TestTheToken::test_a_standard_library_refuses_an_expired_token',
    'tests/unit/test_addons.py::TestTheToken::test_the_add_on_reads_who_is_asking',
]
expect = "fails"

[[control]]
id = 'LEG-0820'
describes = 'ADD-ON: an identity token is signed HS256, the one algorithm a verifier names'
invariant = 'none'
kind = 'mechanical'
path = 'src/elysium/core/addons.py'
old = 'return jwt.encode(claims, secret, algorithm="HS256")'
new = 'return jwt.encode(claims, secret, algorithm="HS512")'
tests = [
    'tests/unit/test_addons.py::TestTheToken::test_a_standard_jwt_library_reads_it_too',
    'tests/unit/test_addons.py::TestTheToken::test_the_add_on_reads_who_is_asking',
]
expect = "fails"
