[[control]]
id = 'LEG-0457'
describes = 'R60: when the preferred source moves, the other source held'
invariant = 'none'
kind = 'semantic'
path = 'src/elysium/core/mirror/source_record.py'
old = '            held, moved = losing_source, chosen_source'
new = '            held, moved = chosen_source, losing_source'
tests = [
    'tests/unit/test_source_track_record.py::TestHowADisagreementEnds::test_the_preferred_source_moving_means_the_other_held',
]
expect = "fails"

