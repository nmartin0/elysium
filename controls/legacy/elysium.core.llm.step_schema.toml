[[control]]
id = 'LEG-0100'
describes = 'AR-5: a filter value is one scalar'
invariant = 'none'
kind = 'semantic'
path = 'src/elysium/core/llm/step_schema.py'
old = '_SCALAR = {"type": ["string", "number", "integer", "boolean"]}'
new = '_SCALAR = {"type": ["string", "number", "integer", "boolean", "array"]}'
tests = [
    'tests/unit/test_step_schema.py::TestWhatTheBenchsModelSentCannotBeSent::test_refused_by_the_grammar[list-filter]',
]
expect = "fails"

