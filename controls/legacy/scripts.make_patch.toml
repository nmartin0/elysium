[[control]]
id = 'LEG-0953'
describes = 'a patch is refused when the commit count is not the one expected'
invariant = 'none'
kind = 'semantic'
path = 'scripts/make_patch.sh'
old = '"$ahead" != "$expected"'
new = '"1" == "2"'
tests = [
    'tests/unit/test_patch_scripts.py::test_make_patch_refuses_wrong_commit_count',
]
expect = "fails"

[[control]]
id = 'LEG-0954'
describes = 'old patches are cleared before a new one is made'
invariant = 'none'
kind = 'semantic'
path = 'scripts/make_patch.sh'
old = 'rm -f "$OUT"/*.patch'
new = 'true'
tests = [
    'tests/unit/test_patch_scripts.py::test_make_patch_clears_old_patches',
]
expect = "fails"

[[control]]
id = 'LEG-0955'
describes = 'a patch that does not apply to the base is refused'
invariant = 'none'
kind = 'semantic'
path = 'scripts/make_patch.sh'
old = 'if ! git am -q "$patch"; then'
new = 'if false; then'
tests = [
    'tests/unit/test_patch_scripts.py::test_make_patch_refuses_a_patch_that_will_not_apply',
]
expect = "fails"

[[control]]
id = 'LEG-0958'
describes = 'a message line starting with From does not inflate the patch count'
invariant = 'none'
kind = 'mechanical'
path = 'scripts/make_patch.sh'
old = "grep -c '^From [0-9a-f]\\{40\\} ' \"$patch\""
new = "grep -c '^From ' \"$patch\""
tests = [
    'tests/unit/test_patch_scripts.py::test_a_message_line_starting_with_from_does_not_inflate_the_count',
]
expect = "fails"

[[control]]
id = 'LEG-0959'
describes = 'a merge ahead of the base is refused'
invariant = 'none'
kind = 'semantic'
path = 'scripts/make_patch.sh'
old = '[[ -z "$(git rev-list --merges "$BASE"..HEAD)" ]]'
new = 'true'
tests = [
    'tests/unit/test_patch_scripts.py::test_make_patch_refuses_a_merge_and_leaves_no_patch',
]
expect = "fails"

[[control]]
id = 'LEG-0960'
describes = "a patch that is not exactly HEAD's files is refused"
invariant = 'none'
kind = 'semantic'
path = 'scripts/make_patch.sh'
old = 'git diff --quiet "$probe" "$BRANCH"'
new = 'true'
tests = [
    'tests/unit/test_patch_scripts.py::test_make_patch_refuses_when_the_base_moved_without_a_conflict',
]
expect = "fails"
