[[control]]
id = 'LEG-0465'
describes = 'R63: code appends the inferred-values note to the answer'
invariant = 'none'
kind = 'semantic'
path = 'src/elysium/core/llm/synthesis_prompt.py'
old = '    return answer + cut + for_the_reader(found)'
new = '    return answer + cut'
tests = [
    'tests/unit/test_answers_say_what_is_inferred.py::TestCodeEnforcesIt::test_the_note_is_appended_whatever_the_model_wrote',
]
expect = "fails"

