[[control]]
id = 'LEG-1088'
describes = 'deprecation alert: a date that has arrived counts as overdue, not still ahead'
invariant = 'none'
kind = 'mechanical'
path = 'src/elysium/core/ontology/deprecation_alerts.py'
old = '        elif when <= today:'
new = '        elif when < today:'
tests = [
    'tests/unit/test_deprecation_alerts.py::TestWhichStage::test_the_stage_from_the_date',
]
expect = "fails"

