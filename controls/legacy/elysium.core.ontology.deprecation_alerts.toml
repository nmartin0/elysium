[[control]]
id = 'LEG-1092'
describes = 'deprecation alert: a notice is written with a dedupe key, so a repeat is one notice'
invariant = 'none'
kind = 'semantic'
path = 'src/elysium/core/ontology/deprecation_alerts.py'
old = 'summary, detail, dedupe_key=f"{finding.key}/{user_id}")'
new = 'summary, detail)'
tests = [
    'tests/unit/test_deprecation_alerts.py::TestOncePerItemPerStagePerPerson::test_a_repeat_is_one_notice',
    'tests/unit/test_deprecation_alerts.py::TestWhoIsToldAndWhere::test_only_active_holders_of_manage_deployment',
]
expect = "fails"

