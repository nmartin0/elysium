[[control]]
id = 'LEG-0467'
describes = 'DEV_UI 13.3: a field a role only knows exists is not called readable'
invariant = 'none'
kind = 'semantic'
path = 'src/elysium/core/ontology/who_can_see.py'
old = 'else READ if shown[name].get("readable") else DISCOVER)'
new = 'else READ)'
tests = [
    'tests/integration/test_who_can_see.py::TestFields::test_discover_without_read_is_its_own_answer',
]
expect = "fails"

[[control]]
