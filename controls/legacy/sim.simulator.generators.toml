[[control]]
id = 'LEG-0007'
describes = "a rule's first matching clause wins"
invariant = 'none'
kind = 'semantic'
path = 'sim/simulator/generators.py'
old = '''
        for condition, generator in self.clauses:
            if _is_true(evaluate(condition, context)):'''
new = '''
        for condition, generator in reversed(self.clauses):
            if _is_true(evaluate(condition, context)):'''
tests = [
    'sim/tests/test_generators.py::test_the_first_matching_clause_wins',
]
expect = "fails"
