# data_silos.yaml  (acme_corp-specific -- where your data physically lives)
#
# Named data-silo instances. Each object type in ontology_schema.yaml
# declares which of these named silos it lives in via its own `silo:`
# key -- this is what lets a deployment span more than one adapter.
# Split out of config.yaml into its own file: connection details
# (hosts, credentials, paths) are a genuinely different kind of
# configuration than operational tuning (which model, how many hops)
# -- often owned or secured differently in a real deployment -- so
# they get their own file, matching this project's existing "one file
# per concern" convention (ontology_schema.yaml for the data model,
# policy.yaml for RBAC/MAC).

data_silos:
  primary_sql:
    adapter: sqlite
    connection:
      path: "dev_fixtures/mediator.db"
      # query_timeout_seconds: 30   # how long ONE query may run
      #
      # ABSENT MEANS THE DEFAULT, which is what nearly every
      # deployment should use. There is ONE worker process, so a
      # hung query does not slow the service -- it stops it.
      #
      # Set it per silo when one source is slower than the rest:
      # a database across a WAN has a different idea of "too
      # long" than one on local disk. 0 disables the deadline
      # entirely, which a silo that genuinely runs long jobs may
      # want and nothing else should.

# A REAL DATABASE, through SQLAlchemy. Commented out because the
# shipped fixtures are SQLite; uncomment and edit to point Elysium at
# something a customer actually runs.
#
#  warehouse_pg:
#    adapter: sqlalchemy
#    connection:
#      # SQLALCHEMY'S OWN URL SHAPE, which is how it names a database.
#      # Keeping the config in that shape rather than inventing
#      # host/port/user keys means a deployment can reach anything
#      # SQLAlchemy has a dialect for -- PostgreSQL, MySQL, Oracle,
#      # SQL Server -- without this project learning about each.
#      url: "postgresql+psycopg://elysium@db.internal:5432/warehouse"
#      # query_timeout_seconds: 30
#      #
#      # SERVER-SIDE where the dialect allows it. On PostgreSQL this
#      # becomes `statement_timeout`, which makes the SERVER abandon
#      # the query -- a client-side timeout only stops waiting, and
#      # leaves the database working on something nobody will read.
#
# THE PASSWORD DOES NOT GO IN THIS FILE. Any value here may carry a
# ${VAR} reference, resolved from the process environment when the
# deployment loads:
#
#      url: "postgresql+psycopg://elysium:${PGPASSWORD}@db/warehouse"
#
# A MISSING VARIABLE REFUSES TO LOAD, naming both the variable and the
# field it came from. Substituting an empty string would produce a URL
# that looks complete and connects as nobody, and the error would name
# the database rather than the configuration.
#
# Set it where secrets already live: systemd's EnvironmentFile=, a
# container runtime's secret mount, or a CI secret. This moves the
# credential out of a file that lands in every backup and usually in
# version control -- it is not a secret store, and does not claim to
# be.

