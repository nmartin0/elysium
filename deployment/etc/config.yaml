# config.yaml  (acme_corp-specific operational settings)
#
# Which LLM backend and model each call uses, and agent-loop tuning.
# Which data silo(s) this deployment reads from lives in its own,
# separate data_silos.yaml -- see that file's own header for why.
# Different deployments can run entirely different models/hardware/
# silos by editing only these files -- core/ code never hardcodes any
# of this.

llm:
  provider: ollama                 # key into deployment_loader's LLM adapter
                                    # registry -- adapters/ollama_adapter.py
  connection:
    base_url: "http://localhost:11434/api/chat"
    request_timeout_seconds: 600   # a 1300-token prompt at the ~5.4 tokens/sec
                                    # prompt-eval rate measured here is ~4
                                    # minutes BEFORE the model writes anything.
                                    # 240 timed out on the first hop.
    keep_alive: -1                 # keep the model resident between calls. The
                                    # default evicts after five minutes, and the
                                    # agent loop can idle longer than that
                                    # between hops on this hardware.
    options:
      num_thread: 2                # matches nproc on this VM
      num_ctx: 4096                # llama-server's own default here; stated
                                    # explicitly so a change is deliberate
  # ONE model for every call, not a step/synthesis pair. Two models
  # mean Ollama loading and evicting between them -- measured at 12-47
  # seconds per load on this hardware, paid at least once per query.
  #
  # phi4-mini specifically because it is NOT a reasoning model. Measured
  # on this deployment, asked to reply with a single word: phi4-mini
  # emitted 2 tokens, gemma4:e2b 84, qwen3.5:2b 370 -- and at ~1.5
  # tokens/sec the token COUNT dominates, not the model's benchmark
  # scores. qwen2.5:3b was also tried as the step model earlier and
  # reverted for repeating its first step (see git history).
  model: "phi4-mini"

agent:
  max_hops: 8
  max_consecutive_duplicates: 2
  max_consecutive_invalid_steps: 2

# Tools the LLM may call, by name -- entirely optional; omitting this
# section (or listing none) is completely valid, unlike llm:, which
# every deployment needs. Registered tools live in
# core/tools/registry.py.
tools:
  enabled:
    - linear_regression
