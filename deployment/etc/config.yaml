# config.yaml  (acme_corp-specific operational settings)
#
# Which LLM backend and model each call uses, and agent-loop tuning.
# Which data silo(s) this deployment reads from lives in its own,
# separate data_silos.yaml -- see that file's own header for why.
# Different deployments can run entirely different models/hardware/
# silos by editing only these files -- core/ code never hardcodes any
# of this.

llm:
  provider: ollama                 # key into deployment_loader's LLM adapter
                                    # registry -- adapters/ollama_adapter.py
  connection:
    base_url: "http://localhost:11434/api/chat"
    request_timeout_seconds: 600   # a 1300-token prompt at the ~5.4 tokens/sec
                                    # prompt-eval rate measured here is ~4
                                    # minutes BEFORE the model writes anything.
                                    # 240 timed out on the first hop.
    # json_num_predict: 768        # tokens a step or plan reply may run to.
                                    # Unlimited, a plan ran until the context
                                    # was full -- 20+ minutes. Prose is uncapped.
    keep_alive: -1                 # keep the model resident between calls. The
                                    # default evicts after five minutes, and the
                                    # agent loop can idle longer than that
                                    # between hops on this hardware.
    options:
      num_thread: 2                # matches nproc on this VM
      num_ctx: 4096                # llama-server's own default here; stated
                                    # explicitly so a change is deliberate
  # ONE model for every call, not a step/synthesis pair. Two models
  # mean Ollama loading and evicting between them -- measured at 12-47
  # seconds per load on this hardware, paid at least once per query.
  #
  # phi4-mini specifically because it is NOT a reasoning model. Measured
  # on this deployment, asked to reply with a single word: phi4-mini
  # emitted 2 tokens, gemma4:e2b 84, qwen3.5:2b 370 -- and at ~1.5
  # tokens/sec the token COUNT dominates, not the model's benchmark
  # scores. qwen2.5:3b was also tried as the step model earlier and
  # reverted for repeating its first step (see git history).
  model: "phi4-mini"
  # SEARCH BY MEANING (R45): the model that turns a record's text into an
  # embedding, for any type declaring `semantic_search: {from: [...]}`
  # in ontology_schema.yaml. Pull it first (`ollama pull
  # nomic-embed-text`), then measure this machine with
  # `python -m scripts.embedding_bench <Type>` before declaring a large
  # table. A sync embeds for at most embedding_budget_seconds and the
  # next one carries on.
  # embedding_model: "nomic-embed-text"
  # embedding_budget_seconds: 300

# CLASSIFICATION LABELS DECIDE FIELD ACCESS (formerly BLOCKING 6). With this on,
# a field labelled `pii` (ontology_schema.yaml, `classification:`) is
# readable only by roles holding `read:label:pii` -- and that one grant
# reads every pii field in the types the role can read. Off by default;
# run `python -m scripts.label_access_diff` first to see who would gain
# and lose what.
# access:
#   label_enforcement: true

# HOW YOUR SOURCES WRITE NUMBERS AND DATES, as a locale (language and
# country). Absent means machine formats only -- `1234.56`, `2024-01-02`
# -- and anything else is set aside as a type mismatch.
#
#   en_US   1,234.56   month first: 01/02/2024 is 2 January
#   pt_BR   1.234,56   day first:   01/02/2024 is 1 February
#
# Read the second column carefully: that ambiguity is the reason this
# is declared rather than guessed. Spanish-speaking South America
# mostly writes as pt_BR does, but NOT ALL OF IT: Peru (es_PE), like
# Mexico, writes numbers as en_US does and dates day first, and Chile
# (es_CL) separates dates with dashes. Name the country.
#
# A SILO WHOSE PEOPLE WRITE DIFFERENTLY sets its own `locale:` in
# data_silos.yaml (or `locale: none` for machine formats only).
# Columns the source DATABASE typed as numbers or dates are never
# affected; this is for text. Two-digit years are always refused.
# source_locale: pt_BR

# LINEAGE AS OPENLINEAGE EVENTS. Every sync writes them to lineage.jsonl
# in the log directory, whatever this says. Name a service to ALSO
# post them there -- Marquez, DataHub, OpenMetadata and their peers
# accept them at /api/v1/lineage. A key, if the service needs one, is
# read from the environment variable named here, never from this file.
# lineage:
#   url: http://marquez:5000/api/v1/lineage
#   namespace: elysium
#   api_key_env: LINEAGE_API_KEY

agent:
  max_hops: 8
  # How long one query may spend gathering before it answers from what it
  # has. The synthesis call after it keeps its own timeout. Default 300.
  # query_deadline_seconds: 300
  # The most tokens one question may spend, as the provider reports them
  # (AL-10). Absent means no budget. Worth setting for a hosted model
  # billed per token; a provider that reports no counts cannot be held
  # to it. Like running out of time, the answer says it may be partial.
  # max_tokens_per_query: 50000
  max_consecutive_duplicates: 2
  max_consecutive_invalid_steps: 2
  # Constrain each step reply to the step vocabulary as a JSON Schema
  # (AR-5): the model cannot name a field, type or step that does not
  # exist. Needs Ollama 0.5+ or vLLM. Off until the bench says it helps:
  #   python -m scripts.llm_bench --constrain
  # constrain_steps: false
  # Four more changes to what the model sees or may do, each built and
  # off until one bench session on THIS model says which help:
  #   python -m scripts.feature_bench
  # 2026-10-14's session said free_text_search and remember_from_query
  # ON, the other two OFF; both ON are waiting on one confirming run of
  # the original seven with them together (BLOCKING.md, agent-loop item).
  # (core/llm/agent_features.py says what each one does.)
  # filter_operators: false     # {"in": [..]}, {"min": .., "max": ..}, ...
  # search_result_cap: 20       # at most this many ids per search reach the model
  # free_text_search: false     # a search_text step, as the UI's search box
  # remember_from_query: false  # remember, only when the question asks to

# Tools the LLM may call, by name -- entirely optional; omitting this
# section (or listing none) is completely valid, unlike llm:, which
# every deployment needs. Registered tools live in
# core/functions/registry.py -- see NAMING below.
# NAMING: "tools" out here, "functions" in the code (004-F3).
#
# THE BOUNDARY WORD IS THE INDUSTRY'S. OpenAI deprecated its
# `functions` parameter in favour of `tools` in 2023 and now rejects
# both together; Azure followed; MCP calls them tools. A deployment
# config and an API field are read by people who have seen those, so
# the boundary says what they expect.
#
# THE CODE KEPT `functions` because renaming a boundary is never just
# a rename -- the 2023 migration changed the request field, the
# response field, the finish reason and the reply message together --
# and renaming the INSIDE buys nothing anyone outside can see. So the
# mapping is written down instead: tools.enabled here names entries
# in core/functions/registry.py, each implementing the Function
# contract in core/functions/interface.py.
tools:
  enabled:
    - linear_regression

# WHERE THE MIRROR LIVES. Reads come from published GOLD, and from
# nothing else (GOLD-9).
#
# THE `read_from_mirror: false` SETTING IS GONE, not merely
# discouraged. It sent reads straight to your databases, bypassing
# standardisation, the declared expectations and their quarantine,
# duplicate-key handling, lineage, identity resolution and gold --
# which is to say it answered with the data BEFORE the ontology had
# been applied to it. A deployment that still declares it is REFUSED
# at load rather than quietly given the new behaviour.
#
# THE WAREHOUSE PATH is optional and defaults to a local one.
# mirror:
#   warehouse: /var/lib/elysium/mirror/warehouse

# TRIGGERS THIS DEPLOYMENT DECLARES. Commented out: none ship. People
# can also make their own in the product (Browse -> Saved views ->
# Watch); these are for conditions the deployment itself should watch.
#
# EACH NAMES AN OWNER and runs as that owner -- counting with its
# authority, proposing actions in its name. It is NOT more powerful
# than a trigger a person makes. The owner may be a person, or a
# service account created for the purpose so the trigger keeps running
# when people leave; either way it must be a real account.
#
# A MISTAKE HERE STOPS THE DEPLOYMENT STARTING, deliberately -- where
# you are looking, rather than when the trigger was meant to fire.
#
# triggers:
#   - name: Large uncategorised transactions
#     owner: ops-bot                  # a real account; see above
#     object_type: Transaction
#     query_text: ""                  # optional free text
#     conditions: []                  # optional, as in a saved view
#     above: 10                       # exactly one of above/at_most/
#                                     # gained/fell
#     recipient_roles: [reviewer]     # optional; each member is counted
#                                     # with their OWN authority
#     action:                         # optional; PROPOSED, never run --
#       type: RecategorizeTransactions  # it waits in Approvals
#       parameter: transaction_ids    # receives what matched
#       values: {new_category: review}
#
# COMBINED, HELD OR SCHEDULED, as in the Watch dialog. Conditions are
# STATES (above, at_most); gained and fell cannot be combined.
#
#   - name: Refunds while busy
#     owner: ops-bot
#     object_type: Transaction
#     conditions: [{field: category, operator: equals, value: refund}]
#     above: 5
#     also:                           # more conditions, at most ten in all
#       - name: Customers             # optional; used in notices and below
#         object_type: Customer
#         conditions: []              # as in a saved view
#         above: 1000                 # or at_most
#     combine: all                    # or any
#     hold_minutes: 240               # true for at least this long first
#     # schedule: {days: [0, 1, 2, 3, 4], time: "09:00"}  # instead of a
#     # timezone: Europe/London       # hold: checked only then, told
#     #                               # every time it is true then
#     action:
#       type: RecategorizeTransactions
#       parameter: transaction_ids
#       values: {new_category: review}
#       objects_from: Refunds while busy   # whose objects; the
#                                     # trigger's own name, or a
#                                     # condition's name under `also`

# WHICH SILOS A CONFIRMED WRITE MAY REACH. Empty means none: an action
# still applies to Elysium's own state -- the pending-write store, the
# audit log, read-your-writes -- and simply does not push to the
# customer's database.
#
# OFF BY DEFAULT, AND NOT POINTING ANYWHERE. Before this key existed
# every deployment wrote to the real database with no toggle at all, so
# one installed to LOOK at data could be made to CHANGE it with nothing
# in the configuration saying so.
#
# A SEPARATE BLOCK rather than a flag on each silo, deliberately: a
# silo you only meant to read cannot become writable by someone editing
# the entry you read it through.
#
# To allow external writes, name the silos:
#
#     write_targets:
#       - primary_sql
#
# DELETING THIS KEY IS NOT THE SAME AS EMPTYING IT. An absent key means
# "a deployment written before this existed", and keeps the old
# behaviour of writing everywhere, with a warning at startup.
write_targets: []

# PEERS WHOSE `X-Forwarded-For` HEADER IS BELIEVED, as addresses or
# CIDRs. Empty means none, which is the safe default: a client that
# sends its own header is ignored and counted by its real address.
#
# WITHOUT THIS, a caller picks its own rate-limit bucket. Rotating the
# header value evades a per-source bound entirely; putting someone
# else's address in it gets THEM locked out, which needs no account.
#
# If Elysium sits behind nginx or a load balancer, name it:
#
#     trusted_proxies:
#       - 10.0.0.0/8
#
# The RIGHTMOST hop is used -- the one your proxy appended. The
# leftmost is whatever the client sent.
trusted_proxies: []

# HOW OFTEN THIS DEPLOYMENT EXPECTS TO SYNC, in hours.
#
# ONE NUMBER, AND EVERY FRESHNESS THRESHOLD DERIVES FROM IT. An
# operator who moves from nightly to hourly changes this and every
# threshold follows -- which is the point. A threshold written as an
# absolute would quietly stop meaning anything the moment the schedule
# changed.
#
#     warn at 1.1 x interval   (26 hours on a nightly deployment)
#     fail at 2.1 x interval   (50 hours)
#
# WARN IS ONE LATE RUN; FAIL IS TWO CONSECUTIVE MISSES. A run that
# slips by an hour is not an incident, and a channel that says it is
# becomes a channel nobody reads.
#
# MEASURED FROM THE PUBLICATION, per object type -- the clock a reader
# actually experiences. A source read hourly but published daily is a
# day stale to the person looking at it, and no source-side number
# catches that.
#
# 24 IS THE DEFAULT, because INSTALL.md leaves scheduling to you and
# nightly is what an unattended deployment does. Uncomment and change
# it if yours runs on another cadence.
#
# A TYPE MAY DECLARE ITS OWN PAIR in ontology_schema.yaml, or declare
# itself exempt. A target TIGHTER than this interval is refused at
# load, naming both numbers: a type asking for two hours on a nightly
# deployment is not ambitious, it is guaranteed to alert forever.
# freshness:
#   sync_interval_hours: 24


# WHAT ONE VALUE THAT WILL NOT COERCE COSTS: the row, or the table.
#
#   refuse      stop the whole table (the behaviour before this key
#               existed, and still what an ABSENT key means)
#   quarantine  set the offending ROWS aside and sync the rest
#
# QUARANTINE IS NOT A DROP. The rows go to quarantine_<silo>.<table>
# with the column, the value and the reason, and the sync says how
# many. An operator can read them; nothing is lost silently.
#
# An `N/A` in an integer column is a TYPE MISMATCH, which is a
# different thing from a malformed record -- the distinction every
# mature ingest parser draws, and the reason refusing the table for
# one bad cell is heavier than it looks.
#
# DELETING THIS KEY IS NOT THE SAME AS SETTING IT TO refuse. An absent
# key means a deployment written before this existed.
on_type_mismatch: quarantine

# WHETHER BRONZE HOLDS COLUMNS THE ONTOLOGY NEVER DECLARED.
#
# false (the shipped default) keeps only declared columns.
# true keeps everything the source has, which was the behaviour
# before this key existed.
#
# THE TRADE. Holding everything makes a column declared NEXT YEAR
# re-derivable from history instead of starting empty. The cost is
# that an undeclared SSN sits in Parquet with no field grant and no
# read path: unreachable through Elysium -- the mediator reads the
# silo a type names, and `bronze_` is a reserved prefix -- and
# readable by anyone with access to the lake's files.
#
# DELETING THIS KEY IS NOT THE SAME AS SETTING IT true. An absent key
# means a deployment written before this existed: it keeps everything
# AND warns at each sync naming the columns, because an existing
# deployment has history the new default would stop extending.
ingest_undeclared_columns: false
