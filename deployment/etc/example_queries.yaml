# example_queries.yaml  (acme_corp-specific -- pure data)
#
# Demo queries for scripts/run_deployment.py, matching acme_corp's own
# seeded dev fixture data (see dev_fixtures/schema.sql for what
# cust_001/003/004 and user_alice/carol actually are). A different
# deployment would list its own users/queries here -- the runner script
# itself never needs to change.

examples:
  - user_id: user_alice
    query: "What are cust_001's recent transactions?"
  - user_id: user_alice
    query: "What are cust_003's recent transactions?"
  - user_id: user_carol
    query: "What are cust_004's recent transactions?"

# ---------------------------------------------------------------------
# SHOWN IN THE QUERY SCREEN: `display: true`
#
# An example WITHOUT this flag is the demo runner's. It executes as a
# named user through the mediator with MAC applied, so naming a real
# object there is a query rather than a disclosure.
#
# An example WITH it is rendered to anybody who opens the query screen,
# before they have asked anything and whatever they are cleared to see.
# `core/display_safety.py` refuses any that names an identifier-shaped
# token, and refuses it at LOAD so a deployment cannot start with a
# leak in its placeholder text.
#
# So a displayed example asks a SHAPE of question -- what the ontology
# can be asked -- never about a particular row.
# ---------------------------------------------------------------------
  - query: "Which customers are in the us-east region?"
    display: true
  - query: "How many transactions were there last month?"
    display: true
  - query: "Show me the customers with the largest total transaction value"
    display: true
  - query: "Which accounts have no transactions at all?"
    display: true
